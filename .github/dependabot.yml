# Dependency update automation.
#
# Added 2026-07 after a fleet-wide OSV sweep found this tree carrying published
# advisories that nothing was watching for. Grouped so this opens a couple of
# reviewable PRs per week rather than thirty single-crate ones -- ungrouped
# Dependabot output is reliably ignored, which is how trees drift.
version: 2

updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      compatible:
        applies-to: version-updates
        update-types: ["patch", "minor"]
      security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # bincode 3.0.0 is a tombstone release containing only a compiler error.
      - dependency-name: "bincode"
        versions: [">=3.0.0"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(ci)"
