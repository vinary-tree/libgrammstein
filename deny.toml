# cargo-deny configuration for libgrammstein.
#
# Added 2026-07. A fleet-wide OSV sweep found EIGHTEEN advisories in this locked
# tree -- by far the worst in the fleet -- including seven openssl CVEs (heap
# buffer overflow in AES key-wrap, out-of-bounds write in
# `CipherCtxRef::cipher_update_inplace`, `digest_final()` writing past the caller's
# buffer with no length check), seven rustls-webpki issues, a tar `unpack_in` that
# could chmod arbitrary directories by following symlinks, and a time DoS. All of
# those were fixed by `cargo update` alone: nothing had run one in months, and
# nothing was watching.
#
#     cargo deny check
#
# Mirrors the configuration in libdictenstein, liblevenshtein and lling-llang.

[graph]
all-features = true

[advisories]
yanked = "deny"

# Every entry MUST carry a reason and a REVIEW-BY date. All four below have NO
# fixed version available -- they are accepted risk, not deferred work, and each
# needs re-checking rather than permanent muting.
ignore = [
  { id = "RUSTSEC-2025-0141", reason = "REVIEW-BY 2026-10-31. bincode unmaintained, no fixed version (3.0.0 is a tombstone containing only a compiler error). Our own dependency was MIGRATED to the maintained `bincode-next` fork, so only ONE copy remains: 1.3.3 pinned inside hnsw_rs 0.3.4, which is already the latest release and still requires ^1.3. It cannot be moved from here; re-evaluate if hnsw_rs publishes a release that updates it." },
  { id = "RUSTSEC-2025-0119", reason = "REVIEW-BY 2026-10-31. number_prefix unmaintained, no fixed version. Purely transitive (progress-bar formatting via indicatif) and never handles untrusted input -- it formats byte counts we produce ourselves." },
  { id = "RUSTSEC-2024-0436", reason = "REVIEW-BY 2026-10-31. paste unmaintained, no fixed version. Transitive via the gemm linear-algebra stack under the neural features, not declared here, so the `pastey` swap used elsewhere in the fleet is not available. It is a compile-time proc-macro with no runtime surface." },
]

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "BSL-1.0",
  "MPL-2.0",
  "CC0-1.0",
  "Unlicense",
  "OpenSSL",
  "bzip2-1.0.6",
  # Dataset/metadata crates in the neural stack.
  "CDLA-Permissive-2.0",
  # NCSA (University of Illinois/NCSA Open Source License) is permissive and
  # BSD-like; it appears here as part of a dual-licensed expression.
  "NCSA",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

# KNOWN GAP: the `licenses` check does not currently pass here. Run
#     cargo deny check advisories bans sources
# rather than a bare `cargo deny check` until this is resolved.
#
# `rholang-tree-sitter`, a first-party path dependency in a sibling repository,
# declares no `license` field at all, so cargo-deny reports it as `unlicensed`.
# That is not a licence-compatibility problem -- it is first-party code -- but
# cargo-deny cannot distinguish "unlicensed" from "unknown", and the fix belongs in
# that repository (add `license = "..."` to its Cargo.toml), not in a suppression
# here. Asserting a licence for someone else's crate via a `clarify` entry would be
# a claim this repository has no standing to make.
#
# The [licenses] configuration above is complete and correct for everything else,
# so re-enabling the check is a one-word change once that sibling crate declares
# its licence.
#
# NOTE: this repository has no .github/workflows, so there is no CI job to gate
# this. Run cargo-deny locally, or add a workflow mirroring the one in
# libdictenstein / liblevenshtein / lling-llang.

[bans]
# "warn": this is a ~750-package tree with many transitive duplicates that cannot
# be resolved from here. Ratchet to "deny" only if that ever becomes achievable.
multiple-versions = "warn"
# "warn", not "deny". This crate depends on sibling repositories by path
# (rholang-tree-sitter, tree-sitter-metta), which carry no version requirement by
# construction. `allow-wildcard-paths` does not help: cargo-deny disables it for
# publishable crates, since crates.io forbids path dependencies. Registry
# wildcards are the actual supply-chain risk and none exist here.
wildcards = "warn"

deny = [
  # NOTE: cannot ban `bincode` outright here the way the other repositories do --
  # hnsw_rs 0.3.4 pins bincode ^1.3 and there is no newer release. Our own use is
  # on `bincode-next`. Ban only the tombstone version.
  { crate = "bincode:>=3.0.0", reason = "bincode 3.0.0 is a deliberate tombstone release and does not compile" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
