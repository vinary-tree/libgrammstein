<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="845px" preserveAspectRatio="none" style="width:464px;height:845px;background:#FAFAFA;" version="1.1" viewBox="0 0 464 845" width="464px" zoomAndPan="magnify"><?plantuml $version$?><defs/><g><rect fill="#FAFAFA" height="845" style="stroke:none;stroke-width:1;" width="464" x="0" y="0"/><g class="title" data-source-line="23"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="422.0269" x="20" y="34.9659">ParadigmProfile::dominant_paradigm() &#8594; Option&lt;Paradigm&gt;</text></g><ellipse cx="131.4617" cy="65.0679" fill="#455A64" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#6A1B9A" height="36.3441" rx="12.5" ry="12.5" style="stroke:#263238;stroke-width:0.5;" width="208.8094" x="27.057" y="95.0679"/><text fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="700" lengthAdjust="spacing" textLength="188.8094" x="37.057" y="117.896">sort the four scores descending</text><rect fill="#6A1B9A" height="52.6882" rx="12.5" ry="12.5" style="stroke:#263238;stroke-width:0.5;" width="133.8074" x="64.558" y="151.412"/><text fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="700" lengthAdjust="spacing" textLength="113.8074" x="74.558" y="174.2401">S&#8333;&#8321;&#8334; &#8592; highest score</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="700" lengthAdjust="spacing" textLength="93.7913" x="84.5661" y="190.5842">S&#8333;&#8322;&#8334; &#8592; runner-up</text><rect fill="#455A64" height="52.6882" rx="12.5" ry="12.5" style="stroke:#263238;stroke-width:0.5;" width="189.5852" x="36.6691" y="281.0821"/><text fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="700" lengthAdjust="spacing" textLength="32.2202" x="115.3516" y="303.9102">None</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="700" lengthAdjust="spacing" textLength="169.5852" x="46.6691" y="320.2544">the sample is too thin to call</text><ellipse cx="131.4617" cy="364.7704" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="131.4617" cy="364.7704" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><polygon fill="#FFF3E0" points="93.2535,224.1003,169.6699,224.1003,181.6699,236.1003,169.6699,248.1003,93.2535,248.1003,81.2535,236.1003,93.2535,224.1003" style="stroke:#EF6C00;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#37474F" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="74.4255" x="135.4617" y="259.8592">yes &#8212; nothing</text><text fill="#37474F" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="77.4725" x="135.4617" y="274.8411">clears the floor</text><text fill="#263238" font-family="sans-serif" font-size="11" font-weight="700" lengthAdjust="spacing" textLength="76.4164" x="93.2535" y="240.3682">S&#8333;&#8321;&#8334; &lt; &#952; = 0.20 ?</text><text fill="#37474F" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.4529" x="181.6699" y="232.8773">no</text><rect fill="#AB47BC" height="69.0323" rx="12.5" ry="12.5" style="stroke:#263238;stroke-width:0.5;" width="176.8651" x="43.0291" y="474.7523"/><text fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="700" lengthAdjust="spacing" textLength="77.7005" x="92.6114" y="497.5804">Some(Mixed)</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="700" lengthAdjust="spacing" textLength="155.9411" x="53.4911" y="513.9245">genuinely multi-paradigm</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="700" lengthAdjust="spacing" textLength="156.8651" x="53.0291" y="530.2686">(e.g. Rust: impl + iter.map)</text><ellipse cx="131.4617" cy="574.7846" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="131.4617" cy="574.7846" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><polygon fill="#FFF3E0" points="79.4431,417.7704,183.4803,417.7704,195.4803,429.7704,183.4803,441.7704,79.4431,441.7704,67.4431,429.7704,79.4431,417.7704" style="stroke:#EF6C00;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#37474F" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="71.0265" x="135.4617" y="453.5293">yes &#8212; the top</text><text fill="#37474F" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="88.2964" x="135.4617" y="468.5112">two are too close</text><text fill="#263238" font-family="sans-serif" font-size="11" font-weight="700" lengthAdjust="spacing" textLength="104.0372" x="79.4431" y="434.0383">S&#8333;&#8321;&#8334; &#8722; S&#8333;&#8322;&#8334; &lt; &#948; = 0.10 ?</text><text fill="#37474F" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="89.0774" x="195.4803" y="426.5474">no &#8212; a clear lead</text><rect fill="#2E7D32" height="52.6882" rx="12.5" ry="12.5" style="stroke:#263238;stroke-width:0.5;" width="142.3049" x="60.3092" y="627.7846"/><text fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="700" lengthAdjust="spacing" textLength="122.3049" x="70.3092" y="650.6127">Some(top paradigm)</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="700" lengthAdjust="spacing" textLength="121.2849" x="70.8193" y="666.9568">one style dominates</text><path d="M162.4617,690.4728 L162.4617,753.4439 L142.4617,757.4439 L162.4617,761.4439 L162.4617,824.415 A0,0 0 0 0 162.4617,824.415 L431.9699,824.415 A0,0 0 0 0 431.9699,824.415 L431.9699,700.4728 L421.9699,690.4728 L162.4617,690.4728 A0,0 0 0 0 162.4617,690.4728" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M421.9699,690.4728 L421.9699,700.4728 L431.9699,700.4728 L421.9699,690.4728" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="148.7981" x="194.0457" y="709.3698">&#952; = 0.20 and &#948; = 0.10 are</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="45.162" x="346.2239" y="709.3698">literals</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="179.6082" x="190.1132" y="727.0759">in the method body. They are</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="22.217" x="373.1014" y="727.0759">not</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="240.9162" x="172.2577" y="744.7819">configurable &#8212; ParadigmConfig carries</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="248.5082" x="168.4617" y="762.4879">no dominance field. To impose your own</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="229.5672" x="177.9322" y="780.1939">thresholds, call present_paradigms(&#952;)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="234.0262" x="175.7027" y="797.8999">and apply your own margin test to the</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="199.7192" x="192.8562" y="815.6059">returned, descending-sorted list.</text><ellipse cx="131.4617" cy="757.4439" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="131.4617" cy="757.4439" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#37474F;stroke-width:1;" x1="131.4617" x2="131.4617" y1="75.0679" y2="95.0679"/><polygon fill="#37474F" points="127.4617,85.0679,131.4617,95.0679,135.4617,85.0679,131.4617,89.0679" style="str