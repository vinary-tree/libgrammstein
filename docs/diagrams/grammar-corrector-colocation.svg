="#00838F" height="58.1358" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="254.3311" x="18.07" y="280.4696"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="149.7714" x="70.3498" y="305.4355">route_tokens(tokens)</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="234.3311" x="28.07" y="324.5034">first = tokens[0], order = |tokens|</text></g><!--entity vf--><g class="entity" data-qualified-name="vf" data-source-line="28" id="ent0003"><rect fill="#1565C0" height="58.1358" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="298.683" x="307.89" y="280.4696"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="275.001" x="319.731" y="305.4355">ShardedView::view_for(first_id, key_len)</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="278.683" x="317.89" y="324.5034">first = get_term(first_id), order = key_len</text></g><!--entity csk--><g class="entity" data-qualified-name="csk" data-source-line="30" id="ent0004"><rect fill="#6A1B9A" height="58.1358" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="415.6666" x="93.4" y="398.6096"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="395.6666" x="103.4" y="423.5755">compute_shard_key_from_token(first, order, granularity)</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="255.3591" x="173.5538" y="442.6434">hash(first)  &#8212;or&#8212;  prefix(first, order)</text></g><!--entity sk--><g class="entity" data-qualified-name="sk" data-source-line="31" id="ent0005"><rect fill="#6A1B9A" height="39.0679" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="85.9538" x="258.26" y="516.7396"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="65.9538" x="268.26" y="541.7055">ShardKey</text></g><!--entity store--><g class="entity" data-qualified-name="store" data-source-line="33" id="ent0006"><rect fill="#00838F" height="58.1358" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="282.471" x="7" y="615.8096"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="262.471" x="17" y="640.7755">store_in_shard(key, varint(ids), count)</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="188.6493" x="53.9109" y="659.8434">get_or_create &#8212; write path</text></g><!--entity read--><g class="entity" data-qualified-name="read" data-source-line="34" id="ent0007"><rect fill="#1565C0" height="58.1358" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="260.9111" x="324.78" y="615.8096"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="170.7994" x="369.8358" y="640.7755">get_shard_readonly(key)</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="240.9111" x="334.78" y="659.8434">resident-or-open-only &#8212; read path</text></g><!--entity shard--><g class="entity" data-qualified-name="shard" data-source-line="35" id="ent0008"><rect fill="#455A64" height="39.0679" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="180.8874" x="210.79" y="733.9496"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="160.8874" x="220.79" y="758.9155">One physical shard trie</text></g><g class="entity" data-qualified-name="GMN17" data-source-line="47" id="ent0018"><path d="M50.11,833.0196 L50.11,913.8437 A0,0 0 0 0 50.11,913.8437 L552.3559,913.8437 A0,0 0 0 0 552.3559,913.8437 L552.