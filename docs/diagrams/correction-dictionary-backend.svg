<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="552px" preserveAspectRatio="none" style="width:1165px;height:552px;background:#FAFAFA;" version="1.1" viewBox="0 0 1165 552" width="1165px" zoomAndPan="magnify"><?plantuml $version$?><defs/><g><rect fill="#FAFAFA" height="552" style="stroke:none;stroke-width:1;" width="1165" x="0" y="0"/><g class="title" data-source-line="21"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="408.0984" x="375.3245" y="24.9659">Dictionary backend &#8212; feeding the Levenshtein automaton</text></g><!--entity pv--><g class="entity" data-qualified-name="pv" data-source-line="23" id="ent0001"><rect fill="#37474F" height="77.2038" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="326.7528" x="315.54" y="47.0679"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="177.1973" x="390.3178" y="72.0339">Google-Books checkpoint</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="306.7528" x="325.54" y="91.1018">PersistentVocabARTrie (mmap, ~13M terms)</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="163.7154" x="397.0587" y="110.1697">lock-free overlay, UTF-8</text></g><!--entity contains--><g class="entity" data-qualified-name="contains" data-source-line="25" id="ent0002"><rect fill="#2E7D32" height="77.2038" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="263.823" x="7" y="184.2679"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="149.6174" x="64.1028" y="209.2339">Dictionary::contains()</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="198.8412" x="39.4909" y="228.3018">walks the real trie &#8212; WORKS</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="243.823" x="17" y="247.3697">(used to skip in-vocabulary tokens)</text></g><!--entity trans--><g class="entity" data-qualified-name="trans" data-source-line="26" id="ent0003"><rect fill="#2E7D32" height="77.2038" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="432.2565" x="687.78" y="184.2679"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="328.9427" x="739.4369" y="209.2339">Dictionary::root() / DictionaryNode::transition()</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="412.2565" x="697.78" y="228.3018">VocabTrieNodeRef = OverlayDictionaryNode&lt;CharKey,u64&gt;</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="372.3831" x="717.7167" y="247.3697">owns an Arc per overlay node &#8594; descends FULL depth</text></g><!--entity auto--><g class="entity" data-qualified-name="auto" data-source-line="28" id="ent0004"><rect fill="#1565C0" height="77.2038" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="273.889" x="341.97" y="332.1379"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="181.3133" x="388.2579" y="357.1039">liblevenshtein Transducer</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="202.7612" x="377.5339" y="376.1718">query_with_distance(term, k)</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="253.889" x="351.97" y="395.2397">runs directly over the persistent trie</text></g><!--entity cand--><g class="entity" data-qualified-name="cand" data-source-line="29" id="ent0005"><rect fill="#2E7D32" height="58.1358" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="172.2634" x="392.78" y="479.9979"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="152.2634" x="402.78" y="504.9639">candidate corrections</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="132.0055" x="412.909" y="524.0318">{the&#183;1, ten&#183;1, tea&#183;2}</text></g><!--entity dawg--><g class="entity" data-qualified-name="dawg" data-source-line="31" id="ent0006"><rect fill="#90A4AE" height="77.2038" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="346.8568" x="305.48" y="184.2679"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="326.8568" x="315.48" y="209.2339">optional: DynamicDawgChar / DoubleArrayTrie</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="287.4609" x="335.1779" y="228.3018">in-memory automaton materialized from</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="306.6688" x="325.574" y="247.3697">iter_terms() &#8212; small, static dictionaries only</text></g><g class="entity" data-qualified-name="GMN14" data-source-line="43" id="ent0015"><path d="M657.08,321.4679 L657.08,419.998 A0,0 0 0 0 657.08,419.998 L1150.7474,419.998 A0,0 0 0 0 1150.7474,419.998 L1150.7474,331.4679 L1140.7474,321.4679 L979.95,321.4679 L975.95,261.7179 L971.95,321.4679 L657.08,321.4679 A0,0 0 0 0 657.08,321.4679" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1140.7474,321.4679 L1140.7474,331.4679 L1150.7474,331.4679 L1140.7474,321.4679" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="442.1563" x="678.3356" y="340.3649">Fixed in libdictenstein: VocabTrieNodeRef was superseded by the shared</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="451.1914" x="673.818" y="358.0709">OverlayDictionaryNode, which holds the child Arc and re-resolves children</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="452.3743" x="673.2266" y="375.777">on demand. The former depth-1 snapshot (childless nodes) is gone, so the</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="422.2013" x="688.3131" y="393.483">generic LevenshteinCorrectionLayer runs **directly over the mmap'd</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="472.6674" x="663.08" y="411.189">SharedVocabARTrie** &#8212; no in-RAM copy, no libgrammstein change required.</text></g><!--link pv to contains--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="dependency" data-source-line="33" id="lnk7"><path d="M315.38,86.1379 C228.28,86.1379 138.91,86.1379 138.91,86.1379 C138.91,86.1379 138.91,138.6279 138.91,179.0579" fill="none" id="pv-to-contains" style="stroke:#37474F;stroke-width:1;"/><polygon fill="#37474F" points="138.91,184.0579,142.91,175.0579,138.91,179.0579,134.91,175.0579,138.91,184.0579" style="stroke:#37474F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link pv to trans--><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" data-link-type="dependency" data-source-line="34" id="lnk8"><path d="M642.62,86.1379 C762.34,86.1379 903.91,86.1379 903.91,86.1379 C903.91,86.1379 903.91,138.6279 903.91,179.0579" fill="none" id="pv-to-trans" style="stroke:#37474F;stroke-width:1;"/><polygon fill="#37474F" points="903.91,184.0579,907.91,175.0579,903.91,179.0579,899.91,175.0579,903.91,184.0579" style="stroke:#37474F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link contains to auto--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" data-link-type="dependency" data-source-line="35" id="lnk9"><path d="M138.91,261.8279 C138.91,305.7579 138.91,371.1379 138.91,371.1379 C138.91,371.1379 242.24,371.1379 336.6,371.1379" fill="none" id="contains-to-auto" style="stroke:#37474F;stroke-width:1;"/><polygon fill="#37474F" points="341.6,371.1379,332.6,367.1379,336.6,371.1379,332.6,375.1379,341.6,371.1379" style="stroke:#37474F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#37474F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="104.2731" x="80.6" y="367.0349">membership test</text></g><!--link trans to auto--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" data-source-line="36" id="lnk10"><path d="M831.87,261.7879 C831.87,277.1179 831.87,291.1379 831.87,291.1379 C831.87,291.1379 524.56,291.1379 524.56,291.1379 C524.56,291.1379 524.56,306.6679 524.56,326.8679" fill="none" id="trans-to-auto" style="stroke:#37474F;stroke-width:1;"/><polygon fill="#37474F" points="524.56,331.8679,528.56,322.8679,524.56,326.8679,520.56,322.8679,524.56,331.8679" style="stroke:#37474F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#37474F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="76.1281" x="595.52" y="287.0349">full traversal</text></g><!--link auto to cand--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" data-link-type="dependency" data-source-line="37" id="lnk11"><path d="M478.91,409.6379 C478.91,431.8579 478.91,454.2579 478.91,474.6679" fill="none" id="auto-to-cand" style="stroke:#37474F;stroke-width:1;"/><polygon fill="#37474F" points="478.91,479.6679,482.91,470.6679,478.91,474.6679,474.91,470.6679,478.91,479.6679" style="stroke:#37474F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link pv to dawg--><g class="link" data-entity-1="ent0001" data-entity-2="ent0006" data-link-type="dependency" data-source-line="39" id="lnk12"><path d="M478.91,124.6179 C478.91,143.1579 478.91,160.2679 478.91,178.8179" fill="none" id="pv-to-dawg" style="stroke:#607D8B;stroke-width:1;stroke-dasharray:7,7;"/><polygon fill="#607D8B" points="478.91,183.8179,482.91,174.8179,478.91,178.8179,474.91,174.8179,478.91,183.8179" style="stroke:#607D8B;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#37474F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="129.4281" x="348.91" y="150.1149">(only if small &amp; static)</text></g><!--link dawg to auto--><g class="link" data-entity-1="ent0006" data-entity-2="ent0004" data-link-type="dependency" data-source-line="40" id="lnk13"><path d="M433.26,261.7179 C433.26,283.3679 433.26,305.2379 433.26,326.8879" fill="none" id="dawg-to-auto" style="stroke:#607D8B;stroke-width:1;stroke-dasharray:7,7;"/><polygon fill="#607D8B" points="433.26,331.8879,437.26,322.8879,433.26,326.8879,429.26,322.8879,433.26,331.8879" style="stroke:#607D8B;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#37474F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="82.0431" x="332.149" y="274.7049">same generic</text><text fill="#37474F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="119.8211" x="313.26" y="292.4109">Dictionary interface</text></g><?plantuml-src ZLRRRXit47tNLmnYe9O4hHrVOhj24q2sumI8qnIsqpxKHK3jpce9SSaDoPMY1Ydwr0ye-YzvpwVaIth8rMNTs43X1zl3uLpEd3dSRNffvkGBfakUiNQ5Pwb9rDwKmXjDqb7EsGxTmADYwwJph3tDJ2h6vAtaRKVdClNIQ64NdMtI9cCgXCuKK_Vdu7O3hnzXlUASdjAR6Lib5fixuQX7PguT2KqZcv8tn28j4CmqparGn2JBYMLdr8mTfOLKcMLDA3FZ4iS3SYRsiga_OvUopbmm8-35syjBs2fVaCcZQ-YX2LsZWanQJhrQnCpnl2n5jPqr3TSAzTBNF_z1GIHrSZLwZPX8n5OA9NyNeQKTUc4PLJsDr-V6JgMU390q5xNoL0bVxD2fgW5F9bp1MM_fQgg8YBeJahCaLkWa41XReTDY01GSsnbdb1jBhXHAaVD8dgB-9QoItGu2NQ5tjaEgbD2-BXKbtiqcb9dKxMPIJAmetMvgREWQ