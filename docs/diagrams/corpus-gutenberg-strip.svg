ust="spacing" textLength="295.8608" x="129.0338" y="405.3218">* END OF THE PROJECT GUTENBERG EBOOK</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="7.588" x="428.5346" y="405.3218">*</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="307.7328" x="99.1299" y="424.3897">licence &#183; donation appeal &#183; contributor index</text></g><!--entity norm--><g class="entity" data-qualified-name="norm" data-source-line="29" id="ent0005"><rect fill="#1565C0" height="58.1358" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="279.237" x="493.38" y="370.8179"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="146.0195" x="559.9888" y="395.7839">Normalizer::default()</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="259.237" x="503.38" y="414.8518">(all four passes off &#8212; a pass-through)</text></g><!--entity doc--><g class="entity" data-qualified-name="doc" data-source-line="30" id="ent0006"><rect fill="#455A64" height="96.2717" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="378.5231" x="443.74" y="500.2979"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="72.5057" x="596.7487" y="525.2639">Document</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="358.5231" x="453.74" y="544.3318">id = file stem, leading &#8220;pg&#8221; stripped (pg1342 &#8658; 1342)</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="297.0789" x="484.4621" y="563.3997">title = file stem &#183; content = normalized text</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="142.3795" x="561.8118" y="582.4676">source = Some(path)</text></g><g class="entity" data-qualified-name="GMN11" data-source-line="38" id="ent0012"><path d="M493.3,92.1179 L493.3,119.4579 L450.15,123.4579 L493.3,127.4579 L493.3,155.236 A0,0 0 0 0 493.3,155.236 L832.7093,155.236 A0,0 0 0 0 832.7093,155.236 L832.7093,102.1179 L822.7093,92.1179 L493.3,92.1179 A0,0 0 0 0 493.3,92.1179" fill="#E3F2FD" style="stroke:#1565C0;stroke-width:0.5;"/><path d="M822.7093,92.1179 L822.7093,102.1179 L832.7093,102.1179 L822.7093,92.1179" fill="#E3F2FD" style="stroke:#1565C0;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="56.368" x="499.3" y="111.0149">start_idx</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="258.6613" x="559.048" y="111.0149">= index just past the newline that ends the</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="296.4003" x="510.3045" y="128.7209">first matching START marker line, plus the run of</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="309.5303" x="503.7395" y="146.427">whitespace that follows it (blank lines are skipped).</text></g><g class="entity" data-qualified-name="GMN14" data-source-line="44" id="ent0015"><path d="M807.33,359.4779 L807.33,429.4579 L446.57,433.4579 L807.33,437.4579 L807.33,440.302 A0,0 0 0 0 807.33,440.302 L1190.6793,440.302 A0,0 0 0 0 1190.6793,440.302 L1190.6793,369.4779 L1180.6793,359.4779 L807.33,359.4779 A0,0 0 0 0 807.33,359.4779" fill="#E3F2FD" style="stroke:#1565C0;stroke-width:0.5;"/><path d="M1180.6793,359.4779 L1180.6793,369.4779 L1190.6793,369.4779 L1180.6793,359.4779" fill="#E3F2FD" style="stroke:#1565C0;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="49.387" x="828.059" y="378.3749">end_idx</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="280.1243" x="880.826" y="378.3749">= length of text[..pos].trim_end(), where pos is</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="186.5502" x="820.9025" y="396.0809">the first matching END marker</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="153.7901" x="1010.8327" y="396.0809">searched from start_idx</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.484" x="1164.6228" y="396.0809">,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="362.3493" x="813.33" y="413.787">so a marker quoted inside the front matter cannot truncate</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="57.5901" x="965.7096" y="431.493">the book.</text></g><g class="entity" data-qualified-name="GMN17" data-source-line="51" id="ent0018"><path d="M429.94,656.5779 L429.94,914.4621 A0,0 0 0 0 429.94,914.4621 L836.0524,914.4621 A0,0 0 0 0 836.0524,914.4621 L836.0524,666.5779 L826.0524,656.5779 L637,656.5779 L633,596.9879 L629,656.5779 L429.94,656.5779 A0,0 0 0 0 429.94,656.5779" fill="#E3F2FD" style="stroke:#1565C0;stroke-width:0.5;"/><path d="M826.0524,656.5779 L826.0524,666.5779 L836.0524,666.5779 L826.0524,656.5779" fill="#E3F2FD" style="stroke:#1565C0;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="77.3241" x="479.646" y="675.4749">Marker sets</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="216.9962" x="560.3501" y="675.4749">&#8212; first match wins, in source order.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="305.1624" x="475.915" y="693.1809">START: "*** START OF THE PROJECT GUTENBERG",</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="264.6283" x="501.252" y="710.887">"*** START OF THIS PROJECT GUTENBERG",</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="256.9323" x="505.1" y="728.593">"***START OF THE PROJECT GUTENBERG",</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="301.0529" x="483.0398" y="746.299">"*END*THE SMALL PRINT"  &#8592; the pre-2000 layout</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="282.3863" x="487.303" y="764.005">END: "*** END OF THE PROJECT GUTENBERG",</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="253.2403" x="506.946" y="781.711">"*** END OF THIS PROJECT GUTENBERG",</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="245.5443" x="510.794" y="799.417">"***END OF THE PROJECT GUTENBERG",</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="360.9193" x="453.1066" y="817.1231">"End of the Project Gutenberg", "End of Project Gutenberg"</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.38" x="626.8062" y="834.8291">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="57.603" x="457.455" y="852.5351">Fail-safe.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="281.0992" x="518.4381" y="852.5351">If no marker matches, or the window is empty</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="152.0077" x="447.4652" y="870.2411">(start_idx &#8805; end_idx), the</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="63.2711" x="602.8529" y="870.2411">whole file</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="140.0231" x="669.504" y="870.2411">is returned rather than</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="385.1124" x="435.94" y="887.9471">nothing &#8212; so a non-Gutenberg .txt still trains. A document that</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="364.5203" x="446.236" y="905.6531">normalises to the empty string is dropped with a log::warn!.</text></g><!--link head to body--><!--link body to tail--><!--link body to norm--><g class="link" data-entity-1="ent0003" data-entity-2="ent0005" data-link-type="dependency" data-source-line="34" id="lnk9"><path d="M453.58,299.8479 C453.58,340.8379 453.58,399.4579 453.58,399.4579 C453.58,399.4579 465.02,399.4579 487.95,399.4579" fill="none" id="body-to-norm" style="stroke:#37474F;stroke-width:1;"/><polygon fill="#37474F" points="492.95,399.4579,483.95,395.4579,487.95,399.4579,483.95,403.4579,492.95,399.4579" style="stroke:#37474F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#37474F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="210.7952" x="454.58" y="365.2349">text[start_idx .. end_idx].to_string()</text></g><!--link norm to doc--><g class="link" data-entity-1="ent0005" data-entity-2="ent0006" data-link-type="dependency" data-source-line="35" id="lnk10"><path d="M633,429.2379 C633,449.3579 633,471.5379 633,494.8479" fill="none" id="norm-to-doc" style="stroke:#37474F;stroke-width:1;"/><polygon fill="#37474F" points="633,499.8479,637,490.8479,633,494.8479,629,490.8479,633,499.8479" style="stroke:#37474F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><g class="legend"