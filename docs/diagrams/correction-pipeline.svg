<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="944px" preserveAspectRatio="none" style="width:589px;height:944px;background:#FAFAFA;" version="1.1" viewBox="0 0 589 944" width="589px" zoomAndPan="magnify"><?plantuml $version$?><defs/><g><rect fill="#FAFAFA" height="944" style="stroke:none;stroke-width:1;" width="589" x="0" y="0"/><g class="title" data-source-line="19"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="364.6816" x="108.7047" y="24.9659">Correction pipeline &#8212; expand &#8594; reweight &#8594; collapse</text></g><!--entity in--><g class="entity" data-qualified-name="in" data-source-line="21" id="ent0001"><rect fill="#455A64" height="58.1358" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="310.5969" x="35.16" y="47.0679"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="38.5698" x="171.1735" y="72.0339">Input</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="290.5969" x="45.16" y="91.1018">\"I saw teh quikc brown fox to the stroe\"</text></g><!--entity tok--><g class="entity" data-qualified-name="tok" data-source-line="22" id="ent0002"><rect fill="#455A64" height="58.1358" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="243.1591" x="68.88" y="165.2079"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="182.4318" x="99.2437" y="190.1739">0. Tokenize &#8594; input lattice</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="223.1591" x="78.88" y="209.2418">one original edge per token slot</text></g><!--entity spell--><g class="entity" data-qualified-name="spell" data-source-line="24" id="ent0003"><rect fill="#1565C0" height="96.2717" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="366.9158" x="7" y="283.3479"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="213.8352" x="54.8824" y="308.3139">1. LevenshteinCorrectionLayer</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="50.0358" x="275.9976" y="308.3139">(DIM 1)</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="237.7753" x="71.5702" y="327.3818">automaton &#8745; Google-Books vocab</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="346.9158" x="17" y="346.4497">teh&#8594;{the&#183;1, ten&#183;1, tea&#183;2}  stroe&#8594;{store&#183;1, stroke&#183;2}</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="223.1871" x="78.8643" y="365.5176">weight = edit distance (Tropical)</text></g><!--entity cfg--><g class="entity" data-qualified-name="cfg" data-source-line="31" id="ent0004"><rect fill="#6A1B9A" height="96.2717" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="306.5369" x="37.19" y="439.6179"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="114.3936" x="104.6037" y="464.5839">2. CfgFilterLayer</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="50.0358" x="226.2773" y="464.5839">(DIM 3)</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="213.4572" x="83.7298" y="483.6518">Earley parse over the lattice &#8212;</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="258.369" x="61.2739" y="502.7197">drop / penalise ungrammatical paths</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="286.5369" x="47.19" y="521.7876">(active only when a grammar is supplied)</text></g><!--entity lm--><g class="entity" data-qualified-name="lm" data-source-line="33" id="ent0005"><rect fill="#2E7D32" height="77.2038" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="294.0489" x="43.43" y="606.5479"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="166.5854" x="70.4959" y="631.5139">3. LanguageModelLayer</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="66.0517" x="244.3612" y="631.5139">(DIM 4+5)</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="274.0489" x="53.43" y="650.5818">w' = (1&#8722;&#955;)&#183;w + &#955;&#183;(&#8722;log &#8473;(word | context))</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="250.7515" x="65.0787" y="669.6497">MKN n-gram &#8853; subword embedding</text></g><!--entity dec--><g class="entity" data-qualified-name="dec" data-source-line="35" id="ent0006"><rect fill="#37474F" height="58.1358" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="300.2509" x="40.33" y="754.4179"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="113.9876" x="133.4617" y="779.3839">4. viterbi / nbest</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="280.2509" x="50.33" y="798.4518">shortest-path argmax over the semiring</text></g><!--entity out--><g class="entity" data-qualified-name="out" data-source-line="36" id="ent0007"><rect fill="#455A64" height="58.1358" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="322.5808" x="29.17" y="872.5479"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="50.2738" x="165.3235" y="897.5139">Output</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="302.5808" x="39.17" y="916.5818">\"I saw the quick brown fox two the store\"</text></g><g class="entity" data-qualified-name="GMN14" data-source-line="46" id="ent0015"><path d="M408.83,299.9179 L408.83,327.6879 L374.22,331.6879 L408.83,335.6879 L408.83,363.036 A0,0 0 0 0 408.83,363.036 L574.0911,363.036 A0,0 0 0 0 574.0911,363.036 L574.0911,309.9179 L564.0911,299.9179 L408.83,299.9179 A0,0 0 0 0 408.83,299.9179" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M564.0911,299.9179 L564.0911,309.9179 L574.0911,309.9179 L564.0911,299.9179" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="134.9921" x="419.4645" y="318.8149">Lattice now encodes a</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="131.3521" x="421.2845" y="336.5209">combinatorial space</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="144.2611" x="414.83" y="354.227">of candidate sentences.</text></g><g class="entity" data-qualified-name="GMN17" data-source-line="51" id="ent0018"><path d="M372.78,595.8879 L372.78,640.6879 L337.94,644.6879 L372.78,648.6879 L372.78,694.418 A0,0 0 0 0 372.78,694.418 L546.1401,694.418 A0,0 0 0 0 546.1401,694.418 L546.1401,605.8879 L536.1401,595.8879 L372.78,595.8879 A0,0 0 0 0 372.78,595.8879" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M536.1401,595.8879 L536.1401,605.8879 L546.1401,605.8879 L536.1401,595.8879" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="139.5941" x="385.163" y="614.7849">Context via topological</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="152.3601" x="378.78" y="632.4909">forward-DP; the LM prior</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="115.6481" x="397.136" y="650.197">overturns even the</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="116.5971" x="396.6615" y="667.903">zero-edit real-word</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="94.5347" x="407.6927" y="685.609">error  to &#8594; two.</text></g><!--link in to tok--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="dependency" data-source-line="38" id="lnk8"><path d="M190.46,105.6479 C190.46,123.6879 190.46,141.6879 190.46,159.7379" fill="none" id="in-to-tok" style="stroke:#37474F;stroke-width:1;"/><polygon fill="#37474F" points="190.46,164.7379,194.46,155.7379,190.46,159.7379,186.46,155.7379,190.46,164.7379" style="stroke:#37474F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link tok to spell--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="39" id="lnk9"><path d="M190.46,223.7079 C190.46,240.9479 190.46,258.1579 190.46,277.9379" fill="none" id="tok-to-spell" style="stroke:#37474F;stroke-width:1;"/><polygon fill="#37474F" points="190.46,282.9379,194.46,273.9379,190.46,277.9379,186.46,273.9379,190.46,282.9379" style="stroke:#37474F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#37474F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="50.388" x="139.46" y="249.2149">EXPAND</text></g><!--link spell to cfg--><g class="link" data-entity-1="ent0003" data-entity-2="en