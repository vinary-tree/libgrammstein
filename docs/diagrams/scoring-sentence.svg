<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="828px" preserveAspectRatio="none" style="width:919px;height:828px;background:#FAFAFA;" version="1.1" viewBox="0 0 919 828" width="919px" zoomAndPan="magnify"><?plantuml $version$?><defs/><g><rect fill="#FAFAFA" height="828" style="stroke:none;stroke-width:1;" width="919" x="0" y="0"/><g class="title" data-source-line="22"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="407.3564" x="252.6919" y="24.9659">Sentence scoring &#8212; SentenceScorer over an n-gram model</text></g><!--entity cands--><g class="entity" data-qualified-name="cands" data-source-line="24" id="ent0001"><rect fill="#546E7A" height="58.1358" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="216.4612" x="433.25" y="47.0679"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="143.6814" x="469.6399" y="72.0339">candidate sentences</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="196.4612" x="443.25" y="91.1018">W&#8317;&#185;&#8318; &#8230; W&#8317;&#7503;&#8318;, lengths N&#8321; &#8230; N_k</text></g><!--entity raw--><g class="entity" data-qualified-name="raw" data-source-line="26" id="ent0002"><rect fill="#1565C0" height="77.2038" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="170.7234" x="456.12" y="165.2079"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="83.2577" x="499.8529" y="190.1739">log_prob(W)</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="100.0436" x="491.4599" y="209.2418">&#931;&#7522; log &#8473;(w&#7522; | h&#7522;)</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="95.7876" x="466.12" y="228.3097">length-biased</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="51.2958" x="565.5476" y="228.3097">(a sum)</text></g><!--entity norm--><g class="entity" data-qualified-name="norm" data-source-line="27" id="ent0003"><rect fill="#1565C0" height="77.2038" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="187.6214" x="265.67" y="313.0779"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="167.6214" x="275.67" y="338.0439">normalized_log_prob(W)</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="145.9494" x="286.506" y="357.1118">(1/N) &#183; &#931;&#7522; log &#8473;(w&#7522; | h&#7522;)</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="113.8056" x="302.5779" y="376.1797">length-invariant</text></g><!--entity ppl--><g class="entity" data-qualified-name="ppl" data-source-line="28" id="ent0004"><rect fill="#1565C0" height="77.2038" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="214.7953" x="37.09" y="460.9379"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="94.2197" x="97.3778" y="485.9039">perplexity(W)</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="194.7953" x="47.09" y="504.9718">exp( &#8722;normalized_log_prob )</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="113.8056" x="87.5849" y="524.0397">length-invariant</text></g><!--entity rank--><g class="entity" data-qualified-name="rank" data-source-line="30" id="ent0005"><rect fill="#455A64" height="58.1358" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="237.1951" x="286.89" y="470.4779"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="108.8076" x="351.0838" y="495.4439">rank_sentences</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="217.1951" x="296.89" y="514.5118">sorted by log_prob, descending</text></g><!--entity best--><g class="entity" data-qualified-name="best" data-source-line="31" id="ent0006"><rect fill="#455A64" height="58.1358" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="137.4875" x="412.74" y="609.4879"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="99.6656" x="431.651" y="634.4539">best_sentence</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="117.4875" x="422.74" y="653.5218">argmax log_prob</text></g><g class="entity" data-qualified-name="GMN14" data-source-line="44" id="ent0015"><path d="M630.24,302.4079 L630.24,400.938 L904.7402,400.938 L904.7402,312.4079 L894.7402,302.4079 L630.24,302.4079" fill="#E3F2FD" style="stroke:#181818;stroke-width:0.5;"/><path d="M894.7402,302.4079 L894.7402,312.4079 L904.7402,312.4079 L894.7402,302.4079" fill="#E3F2FD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="234.6633" x="645.6585" y="321.3049">Every log &#8473;(w&#7522; | h&#7522;) &lt; 0, so appending a</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="85.6571" x="636.24" y="339.0109">word can only</text><text fill="#000000" font-family="sans-serif" font-size="13" font-style="italic" lengthAdjust="spacing" textLength="31.733" x="725.2771" y="339.0109">lower</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="129.3501" x="760.3901" y="339.0109">log_prob. Comparing</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="239.1352" x="643.4225" y="356.717">unequal-length candidates by log_prob</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="219.3362" x="653.322" y="374.423">therefore systematically favours the</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="80.5351" x="722.7226" y="392.129">shortest one.</text></g><g class="entity" data-qualified-name="GMN17" data-source-line="52" id="ent0018"><path d="M6,598.1479 L6,678.972 A0,0 0 0 0 6,678.972 L282.9702,678.972 A0,0 0 0 0 282.9702,678.972 L282.9702,608.1479 L272.9702,598.1479 L148.49,598.1479 L144.49,538.6379 L140.49,598.1479 L6,598.1479 A0,0 0 0 0 6,598.1479" fill="#E3F2FD" style="stroke:#181818;stroke-width:0.5;"/><path d="M272.9702,598.1479 L272.9702,608.1479 L282.9702,608.1479 L272.9702,598.1479" fill="#E3F2FD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="254.5403" x="12.715" y="617.0449">Equal-length candidates (spelling variants</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="255.0082" x="12.481" y="634.7509">of one sentence) rank identically under all</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="255.9702" x="12" y="652.457">three scores &#8212; the bias only bites when N</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="42.705" x="118.6326" y="670.163">differs.</text></g><!--link cands to raw--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="dependency" data-source-line="33" id="lnk7"><path d="M541.49,105.4279 C541.49,123.0979 541.49,140.8179 541.49,159.9679" fill="none