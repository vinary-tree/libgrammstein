.3138">125M params &#183; 12 layers &#183; d = 768</text></g><!--entity cls--><g class="entity" data-qualified-name="libgrammstein . UniXcoderEmbedder..embed_code.cls" data-source-line="37" id="ent0010"><rect fill="#2E7D32" height="58.1358" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="147.4555" x="597.44" y="528.9499"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="80.8217" x="630.7569" y="553.9158">CLS pooling</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="127.4555" x="607.44" y="572.9838">v = H&#8320; = data[..768]</text></g><!--entity out--><g class="entity" data-qualified-name="libgrammstein . UniXcoderEmbedder..embed_code.out" data-source-line="38" id="ent0011"><rect fill="#455A64" height="39.0679" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="182.0267" x="580.15" y="658.4299"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="89.2357" x="590.15" y="683.3958">L2 normalize</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="11.7305" x="683.0257" y="683.3958">&#8594;</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="53.7806" x="698.3961" y="683.3958">v&#770; &#8712; &#8477;&#8311;&#8310;&#8312;</text></g><g class="entity" data-qualified-name="GMN18" data-source-line="50" id="ent0019"><path d="M6,359.0799 L6,457.61 L400.3343,457.61 L400.3343,369.0799 L390.3343,359.0799 L6,359.0799" fill="#ECEFF1" style="stroke:#181818;stroke-width:0.5;"/><path d="M390.3343,359.0799 L390.3343,369.0799 L400.3343,369.0799 L390.3343,359.0799" fill="#ECEFF1" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="259.8702" x="35.699" y="377.9769">The shipped tokenizer call passes the code</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="59.202" x="298.9492" y="377.9769">verbatim</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.484" x="358.1513" y="377.9769">.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="336.2228" x="30.5558" y="395.6829">It emits no &#10216;encoder-only&#10217; mode prefix, so the model is</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="336.4013" x="30.4665" y="413.3889">driven off-protocol relative to the paper. In practice the</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="373.3343" x="12" y="431.095">bidirectional export is already encoder-only, but a checkpoint</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="299.6633" x="48.8355" y="448.801">that keys on the prefix will be under-conditioned.</text></g><g class="entity" data-qualified-name="GMN21" data-source-line="58" id="ent0022"><path d="M810.2,517.6099 L810.2,554.4999 L745.11,558.4999 L810.2,562.4999 L810.2,598.434 A0,0 0 0 0 810.2,598.434 L1068.1252,598.434 A0,0 0 0 0 1068.1252,598.434 L1068.1252,527.6099 L1058.1252,517.6099 L810.2,517.6099 A0,0 0 0 0 810.2,517.6099" fill="#E8F5E9" style="stroke:#181818;stroke-width:0.5;"/><path d="M1058.1252,517.6099 L1058.1252,527.6099 L1068.1252,527.6099 L1058.1252,517.6099" fill="#E8F5E9" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="227.7862" x="820.7695" y="536.5069">Contrastive pre-training (multi-modal</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="210.8212" x="829.252" y="554.2129">contrastive learning + cross-modal</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="236.9252" x="816.2" y="571.9189">generation) is what makes the CLS row</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="155.0381" x="857.1435" y="589.625">a usable similarity vector.</text></g><!--link m1 to enc--><g class="link" data-entity-1="ent0002" data-entity-2="ent0009" data-link-type="dependency" data-source-line="41" id="lnk12"><path d="M1665.17,162.3299 C1665.17,240.4499 1665.17,408.4999 1665.17,408.4999 C1665.17,408.4999 1052.94,408.4999 783.51,408.4999" fill="none" id="m1-to-enc" style="stroke:#90A4AE;stroke-width:1;stroke-dasharray:7,7;"/><polygon fill="#90A4AE" points="778.51,408.4999,787.51,412.4999,783.51,408.4999,787.51,404.4999,778.51,408.4999" style="stroke:#90A4AE;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#37474F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="133.4581" x="1210.92" y="386.3969">the mode the weights</text><text fill="#37474F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="52.962" x="1228.7885" y="404.1029">are used</text><text fill="#37474F" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="26.611" x="1285.1306" y="404.1029">as if</text><text fill="#37474F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="11.388" x="1315.1216" y="404.1029">in</text></g><!--link ast to tok--><g class="link" data-entity-1="ent0005" data-entity-2="ent0008" data-link-type="dependency" data-source-line="42" id="lnk13"><path d="M834.22,157.4999 C791.55,157.4999 751.69,157.4999 751.69,157.4999 C751.69,157.4999 751.69,187.3799 751.69,216.5499" fill="none" id="ast-to-tok" style="stroke:#90A4AE;stroke-width:1;stroke-dasharray:7,7;"/><polygon fill="#90A4AE" points="751.69,221.5499,755.69,212.5499,751.69,216.5499,747.69,212.5499,751.69,2