"187.1233" x="340.5712" y="228.3097">(empty sentences skipped)</text></g><!--entity ctx--><g class="entity" data-qualified-name="ctx" data-source-line="25" id="ent0003"><rect fill="#1565C0" height="77.2038" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="243.4251" x="312.42" y="302.4079"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="112.1675" x="378.0488" y="327.3739">context window</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="158.5774" x="354.8439" y="346.4418">h&#7522; = w_(i&#8722;n+1) &#8230; w_(i&#8722;1)</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="223.4251" x="322.42" y="365.5097">saturating at the sentence start</text></g><!--entity lp--><g class="entity" data-qualified-name="lp" data-source-line="26" id="ent0004"><rect fill="#1565C0" height="77.2038" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="222.4112" x="322.93" y="441.4179"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="159.9494" x="354.1609" y="466.3839">NgramModel::log_prob</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="125.2155" x="371.5279" y="485.4518">log &#8473;_MKN(w&#7522; | h&#7522;)</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="202.4112" x="332.93" y="504.5197">Modified Kneser-Ney backoff</text></g><!--entity oov--><g class="entity" data-qualified-name="oov" data-source-line="27" id="ent0005"><rect fill="#1E88E5" height="58.1358" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="252.2561" x="219" y="580.4379"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="75.9497" x="307.1532" y="605.4039">OOV probe</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="232.2561" x="229" y="624.4718">log &#8473; &#8804; &#8722;ln |V|  &#8658;  oov_count += 1</text></g><!--entity acc--><g class="entity" data-qualified-name="acc" data-source-line="29" id="ent0006"><rect fill="#1565C0" height="77.2038" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="212.3172" x="327.97" y="698.5679"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="81.6757" x="393.2908" y="723.5339">accumulate</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="159.7674" x="354.2449" y="742.6018">&#931; log &#8473; &#183; total_tokens N</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="192.3172" x="337.97" y="761.6697">oov_count &#183; sentence_count</text></g><!--entity pp--><g class="entity" data-qualified-name="pp" data-source-line="30" id="ent0007"><rect fill="#1565C0" height="58.1358" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="294.8749" x="9.69" y="838.2679"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="175.1113" x="69.5718" y="863.2339">PP = exp( &#8722;(1/N) &#183; &#931; log &#8473; )</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="274.8749" x="19.69" y="882.3018">exponentiated per-token cross-entropy</text></g><!--entity res--><g class="entity" data-qualified-name="res" data-source-line="32" id="ent0008"><rect fill="#455A64" height="77.2038" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="300.2649" x="7" y="958.8979"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="114.9536" x="99.6557" y="983.8639">PerplexityResult</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="280.2649" x="17" y="1002.9318">perplexity &#183; total_log_prob &#183; total_tokens</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="263.857" x="25.2039" y="1021.9997">oov_count &#183; oov_rate &#183; sentence_count</text></g><!--entity err--><g class="entity" data-qualified-name="err" data-source-line="33" id="ent0009"><rect fill="#C62828" height="39.0679" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="186.4594" x="617.9" y="847.7979"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="166.4594" x="627.9" y="872.7639">Err(Error::EmptyCorpus)</text></g><g class="entity" data-qualified-name="GMN19" data-source-line="46" id="ent0020"><path d="M580.38,439.6079 L580.38,476.0979 L545.57,480.0979 L580.38,484.0979 L580.38,520.432 A0,0 0 0 0 580.38,520.432 L833.8852,520.432 A0,0 0 0 0 833.8852,520.432 L833.8852,449.6079 L823.8852,439.6079 L580.38,439.6079 A0,0 0 0 0 580.38,439.6079" fill="#E3F2FD" style="stroke:#181818;stroke-width:0.5;"/><path d="M823.8852,439.6079 L823.8852,449.6079 L833.8852,449.6079 L823.8852,439.6079" fill="#E3F2FD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="219.8562" x="592.7045" y="458.5049">Scoring reuses the model's ordinary</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="199.6152" x="602.825" y="476.2109">query path &#8212; perplexity adds no</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="232.5052" x="586.38" y="493.917">smoothing of its own, so PP measures</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="170.7942" x="617.2355" y="511.623">the model you actually ship.</text></g><g class="entity" data-qualified-name="GMN22" data-source-line="53" id="ent0023"><path d="M339.79,835.7779 L339.79,873.0979 L304.68,877.0979 L339.79,881.0979 L339.79,898.896 A0,0 0 0 0 339.79,898.896 L582.4792,898.896 A0,0 0 0 0 582.4792,898.896 L582.4792,845.7779 L572.4792,835.7779 L339.79,835.7779 A0,0 0 0 0 339.79,835.7779" fill="#E3F2FD" style="stroke:#181818;stroke-width:0.5;"/><path d="M572.4792,835.7779 L572.4792,845.7779 L582.4792,845.7779 L572.4792,835.7779" fill="#E3F2FD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="221.6892" x="345.79" y="854.6749">PP is the model's average branching</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="206.0242" x="353.6225" y="872.3809">factor. Lower is better; PP = |V| is</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="157.1441" x="378.0625" y="890.087">exactly uniform guessing.</text></g><!--link reader to tok--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="dependency" data-source-line="35" id="lnk10"><path d="M434.13,105.4279 C434.13,123.0979 434.13,140.8179 434.13,159.9679" fill="none" id="reader-to-tok" style="stroke:#37474F;stroke-width:1;"/><polygon fill="#37474F" points="434.13,164.9679,438.13,155.9679,434.13,159.9679,430.13,155.9679,434.13,164.9679" style="stroke:#37474F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#37474F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="79.3001" x="354.13" y="131.0949">per sentence</text></g><!--link tok to ctx--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="36" id="lnk11"><path d="M434.13,242.7579 C434.13,261.2979 434.13,