<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="748px" preserveAspectRatio="none" style="width:544px;height:748px;background:#FAFAFA;" version="1.1" viewBox="0 0 544 748" width="544px" zoomAndPan="magnify"><?plantuml $version$?><defs/><g><rect fill="#FAFAFA" height="748" style="stroke:none;stroke-width:1;" width="544" x="0" y="0"/><g class="title" data-source-line="16"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="364.5306" x="86.7179" y="24.9659">PcfgTrainer &#8212; count productions, normalize per LHS</text></g><!--entity corpus--><g class="entity" data-qualified-name="corpus" data-source-line="18" id="ent0001"><rect fill="#546E7A" height="58.1358" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="209.5453" x="117.06" y="47.0679"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="98.4196" x="172.6229" y="72.0339">Parsed corpus</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="189.5453" x="127.06" y="91.1018">tree-sitter ASTs (error-free)</text></g><!--entity extract--><g class="entity" data-qualified-name="extract" data-source-line="20" id="ent0002"><rect fill="#EF6C00" height="77.2038" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="274.824" x="84.42" y="165.2079"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="91.1396" x="176.2622" y="190.1739">extract_rules</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="250.2615" x="96.7013" y="209.2418">named node with named children &#8658;</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="254.824" x="94.42" y="228.3097">A &#8594; X&#8321; X&#8322; &#8230; X&#8342;  (leaf+text &#8658; terminal)</text></g><!--entity counts--><g class="entity" data-qualified-name="counts" data-source-line="22" id="ent0003"><rect fill="#EF6C00" height="58.1358" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="208.1882" x="117.74" y="302.4079"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="80.9197" x="181.3743" y="327.3739">rule_counts</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="188.1882" x="127.74" y="346.4418">HashMap&#10216;Production, u64&#10217;</text></g><!--entity cfg--><g class="entity" data-qualified-name="cfg" data-source-line="24" id="ent0004"><rect fill="#EF6C00" height="58.1358" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="227.4512" x="108.11" y="420.5379"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="94.1216" x="174.7748" y="445.5039">WeightedCFG</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="207.4512" x="118.11" y="464.5718">rules &#183; rules_by_lhs &#183; lhs_totals</text></g><!--entity norm--><g class="entity" data-qualified-name="norm" data-source-line="26" id="ent0005"><rect fill="#1565C0" height="58.1358" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="322.7584" x="60.45" y="538.6779"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="159.4034" x="142.1275" y="563.6439">normalize / probability</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="302.7584" x="70.45" y="582.7118">&#8473;(A &#8594; &#945;) = weight(A &#8594; &#945;) / &#931;_&#946; weight(A &#8594; &#946;)</text></g><!--entity deriv--><g class="entity" data-qualified-name="deriv" data-source-line="28" id="ent0006"><rect fill="#1565C0" height="77.2038" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="151.6639" x="7" y="656.8179"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="114.7996" x="25.4322" y="681.7839">Derivation score</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="131.6639" x="17" y="700.8518">&#8473;(&#964;) = &#8719;_{r &#8712; &#964;} &#8473;(r)</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="129.0655" x="18.2992" y="719.9197">log &#8473;(&#964;) = &#931; log &#8473;(r)</text></g><g class="entity" data-qualified-name="GMN12" data-source-line="37" id="ent0013"><path d="M193.69,663.8579 L193.69,726.976 A0,0 0 0 0 193.69,726.976 L529.9664,726.976 A0,0 0 0 0 529.9664,726.976 L529.9664,673.8579 L519.9664,663.8579 L292.45,663.8579 L288.45,597.0379 L284.45,663.8579 L193.69,663.8579 A0,0 0 0 0 193.69,663.8579" fill="#E3F2FD" style="stroke:#181818;stroke-width:0.5;"/><path d="M519.9664,663.8579 L519.9664,673.8579 L529.9664,673.8579 L519.9664,663.8579" fill="#E3F2FD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="248.3392" x="233.1586" y="682.7549">weights are raw counts until normalize();</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="244.5043" x="235.0761" y="700.4609">probability() divides by the per-LHS total</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="315.2764" x="199.69" y="718.167">on demand, so a grammar is usable un-normalized.</text></g><!--link corpus to extract--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="dependency" data-source-li