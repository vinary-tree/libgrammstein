<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="627px" preserveAspectRatio="none" style="width:728px;height:627px;background:#FAFAFA;" version="1.1" viewBox="0 0 728 627" width="728px" zoomAndPan="magnify"><?plantuml $version$?><defs/><g><rect fill="#FAFAFA" height="627" style="stroke:none;stroke-width:1;" width="728" x="0" y="0"/><g class="title" data-source-line="16"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="485.9942" x="117.5423" y="24.9659">WFST composition &#8212; states are tuples, so the search is N-dimensional</text></g><!--entity t1--><g class="entity" data-qualified-name="t1" data-source-line="18" id="ent0001"><rect fill="#1565C0" height="58.1358" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="211.4352" x="7" y="47.0679"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="115.7655" x="54.8348" y="72.0339">T&#8321; &#183; edit-distance</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="191.4352" x="17" y="91.1018">states q&#8321;, weight = distance</text></g><!--entity t2--><g class="entity" data-qualified-name="t2" data-source-line="19" id="ent0002"><rect fill="#2E7D32" height="58.1358" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="246.2398" x="253.6" y="47.0679"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="100.0016" x="326.7191" y="72.0339">T&#8322; &#183; n-gram LM</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="226.2398" x="263.6" y="91.1018">states q&#8322;, weight = &#8722;log &#8473;(w&#9474;ctx)</text></g><!--entity comp--><g class="entity" data-qualified-name="comp" data-source-line="21" id="ent0003"><rect fill="#6A1B9A" height="77.2038" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="345.2592" x="72.09" y="184.7179"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="66.2054" x="211.6169" y="209.6839">T = T&#8321; &#8728; T&#8322;</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="290.2034" x="99.6179" y="228.7518">states = pairs (q&#8321;, q&#8322;)  &#8592; Cartesian product</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="325.2592" x="82.09" y="247.8197">path weight  w(p) = &#8855;&#7522; w(e&#7522;)  (semiring product)</text></g><!--entity dec--><g class="entity" data-qualified-name="dec" data-source-line="23" id="ent0004"><rect fill="#37474F" height="77.2038" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="300.2665" x="94.58" y="341.4379"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="50.3858" x="219.5203" y="366.4039">decode</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="205.9952" x="141.7156" y="385.4718">viterbi (Tropical) / nbest (Log)</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="280.2665" x="104.58" y="404.5397">beam pruning keeps &#8719; of sizes tractable</text></g><!--entity out--><g class="entity" data-qualified-name="out" data-source-line="24" id="ent0005"><rect fill="#455A64" height="39.0679" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="220.0032" x="134.72" y="478.6379"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="12.0679" x="144.72" y="503.6039">&#373;</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="184.2953" x="160.4279" y="503.6039">&#8212; joint-optimal correction</text></g><g class="entity" data-qualified-name="GMN10" data-source-line="32" id="ent0011"><path d="M452.36,165.1979 L452.36,219.7079 L417.68,223.7079 L452.36,227.7079 L452.36,281.434 A0,0 0 0 0 452.36,281.434 L713.0788,281.434 A0,0 0 0 0 713.0788,281.434 L713.0788,175.1979 L703.0788,165.1979 L452.36,165.1979 A0,0 0 0 0 452.36,165.1979" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M703.0788,165.1979 L703.0788,175.1979 L713.0788,175.1979 L703.0788,165.1979" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="231.2962" x="462.5713" y="184.0949">Searching the composition is dynamic</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="238.3422" x="459.0483" y="201.8009">programming over a 2-D grid of (q&#8321;,q&#8322;);</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="196.7422" x="479.8483" y="219.507">stacking T&#8345; makes it an n-D grid.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="136.8901" x="467.4463" y="237.213">Global optimality does</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="22.217" x="607.7164" y="237.213">not</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="55.679" x="633.3134" y="237.213">compose</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="239.7188" x="458.36" y="254.919">from per-layer optima &#8594; beam / k-best,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="191.3082" x="482.5653" y="272.625">a Pareto-frontier phenomenon.</text></g><!--link t1 to comp--><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" data-link-type="dependency" data-source-line="26" id="lnk6"><path d="M145.26,105.5679 C145.26,128.2179 145.26,154.7179 145.26,179.4479" fill="none" id="t1-to-comp" style="stroke:#37474F;stroke-width:1;"/><polygon fill="#37474F" points="145.26,184.4479,149.26,175.4479,145.26,179.4479,141.26,175.4479,145.26,184.4479" style="stroke:#37474F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#37474F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="8.1377" x="136.26" y="140.9049">&#8728;</text></g><!--link t2 to comp--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="27" id="lnk7"><path d="M335.47,105.5679 C335.47,128.2179 335.47,154.7179 335.47,179.4479" fill="none" id="t2-to-comp" style="stroke:#37474F;stroke-width:1;"/><polygon fill="#37474F" points="335.47,184.4479,339.47,175.4479,335.47,179.4479,331.47,175.4479,335.47,184.4479" style="stroke:#37474F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#37474F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="8.1377" x="326.47" y="140.9049">&#8728;</text></g><!--link comp to dec--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" data-source-line="28" id="lnk8"><path d="M244.72,262.0579 C244.72,286.1679 244.72,312.0679 244.72,336.1979" fill="none" id="comp-to-dec" style="stroke:#37474F;stroke-width:1;"/><polygon fill="#37474F" points="244.72,341.1979,248.72,332.1979,244.72,336.1979,240.72,332.1979,244.72,341.1979" style="stroke:#37474F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link dec to out--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" data-link-type="dependency" data-source-line="29" id="lnk9"><path d="M244.72,419.0479 C244.72,438.9379 244.72,457.2779 244