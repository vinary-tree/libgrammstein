<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="573px" preserveAspectRatio="none" style="width:1447px;height:573px;background:#FAFAFA;" version="1.1" viewBox="0 0 1447 573" width="1447px" zoomAndPan="magnify"><?plantuml $version$?><defs/><g><rect fill="#FAFAFA" height="573" style="stroke:none;stroke-width:1;" width="1447" x="0" y="0"/><g class="title" data-source-line="19"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="525.166" x="457.8715" y="24.9659">Domain adaptation &#8212; mixture of two experts, &#955; fitted on a held-out dev set</text></g><!--entity gc--><g class="entity" data-qualified-name="gc" data-source-line="21" id="ent0001"><rect fill="#546E7A" height="58.1358" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="219.5132" x="35.12" y="47.0679"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="104.3276" x="92.7128" y="72.0339">general corpus</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="199.5132" x="45.12" y="91.1018">broad &#183; large &#183; out-of-domain</text></g><!--entity dc--><g class="entity" data-qualified-name="dc" data-source-line="22" id="ent0002"><rect fill="#546E7A" height="58.1358" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="201.2573" x="912.25" y="47.0679"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="103.7676" x="960.9949" y="72.0339">domain corpus</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="181.2573" x="922.25" y="91.1018">narrow &#183; small &#183; in-domain</text></g><!--entity g--><g class="entity" data-qualified-name="g" data-source-line="24" id="ent0003"><rect fill="#1565C0" height="77.2038" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="275.7511" x="7" y="184.7179"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="148.1614" x="70.7948" y="209.6839">&#8473;_g &#8212; general expert</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="255.7511" x="17" y="228.7518">TrainerBuilder.order(n).train(reader)</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="198.7292" x="45.5109" y="247.8197">wide coverage, wrong priors</text></g><!--entity d--><g class="entity" data-qualified-name="d" data-source-line="25" id="ent0004"><rect fill="#2E7D32" height="77.2038" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="221.4872" x="902.13" y="184.7179"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="147.6014" x="939.0729" y="209.6839">&#8473;_d &#8212; domain expert</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="198.4773" x="913.635" y="228.7518">same order &#183; same tokenizer</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="201.4872" x="912.13" y="247.8197">right priors, sparse &amp; narrow</text></g><!--entity mix--><g class="entity" data-qualified-name="mix" data-source-line="27" id="ent0005"><rect fill="#1B6CA8" height="77.2038" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="307.3629" x="304.19" y="343.2479"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="55.7198" x="430.0115" y="368.2139">mixture</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="287.3629" x="314.19" y="387.2818">&#8473;_&#955;(w | h) = (1&#8722;&#955;)&#183;&#8473;_g(w | h) + &#955;&#183;&#8473;_d(w | h)</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="218.2982" x="348.7223" y="406.3497">&#955; = 0 &#8658; general &#183; &#955; = 1 &#8658; domain</text></g><!--entity dev--><g class="entity" data-qualified-name="dev" data-source-line="29" id="ent0006"><rect fill="#546E7A" height="58.1358" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="159.9435" x="377.9" y="47.0679"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="50.3018" x="432.7208" y="72.0339">dev set</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="139.9435" x="387.9" y="91.1018">held out &#183; in-domain</text></g><!--entity tune--><g class="entity" data-qualified-name="tune" data-source-line="30" id="ent0007"><rect fill="#6A1B9A" height="96.2717" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="280.763" x="317.49" y="175.1879"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="27.3559" x="444.1936" y="200.1539">fit &#955;</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="123.4375" x="327.49" y="219.2218">LL(&#955;) = &#931; log &#8473;_&#955; is</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="57.0358" x="454.5675" y="219.2218">concave</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="73.0097" x="515.2433" y="219.2218">(Lemma 1)</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="240.5736" x="337.5847" y="238.2897">&#8658; grid / ternary search or EM finds</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="23.5339" x="379.1148" y="257.3576">the</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="43.1758" x="406.2887" y="257.3576">global</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="83.5237" x="453.1045" y="257.3576">optimum &#955;*</text></g><!--entity test--><g class="entity" data-qualified-name="test" data-source-line="32" id="ent0008"><rect fill="#546E7A" height="58.1358" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="290.059" x="1143.85" y="352.7879"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="52.6398" x="1262.5596" y="377.7539">test set</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="270.059" x="1153.85" y="396.8218">held out &#183; in-domain &#183; disjoint from dev</text></g><!--entity rep--><g class="entity" data-qualified-name="rep" data-source-line="33" id="ent0009"><rect fill="#00838F" height="77.2038" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="259.7911" x="430.98" y="482.2679"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="44.5478" x="538.6016" y="507.2339">report</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="239.7911" x="440.98" y="526.3018">PP_general vs PP_domain vs PP(&#955;*)</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="222.3472" x="449.702" y="545.3697">OOV coverage &#183; per-word scores</text></g><g class="entity" data-qualified-name="GMN21" data-source-line="48" id="ent0022"><path d="M632.85,165.2079 L632.85,219.4679 L598.74,223.4679 L632.85,227.4679 L632.85,281.444 A0,0 0 0 0 632.85,281.444 L866.9072,281.444 A0,0 0 0 0 866.9072,281.444 L866.9072,175.2079 L856.9072,165.2079 L632.85,165.2079 A0,0 0 0 0 632.85,165.2079" fill="#F3E5F5" style="stroke:#181818;stroke-width:0.5;"/><path d="M856.9072,165.2079 L856.9072,175.2079 L866.9072,175.2079 L856.9072,165.2079" fill="#F3E5F5" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="202.5272" x="644.115" y="184.1049">PP is monotone-decreasing in LL,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="14.092" x="651.9417" y="201.8109">so</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="108.0807" x="669.4137" y="201.8109">min PP &#8801; max LL</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="61.3211" x="777.4944" y="201.8109">. Any local</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="213.0572" x="638.85" y="219.517">optimum of a concave objective on</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="205.2962" x="642.7305" y="237.223">[0, 1] is the global one &#8212; a coarse</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="201.2012" x="644.778" y="254.929">grid followed by a ternary search</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="128.0631" x="681.347" y="272.635">is sufficient and safe.</text></g><g class="entity" data-qualified-name="GMN24" data-source-line="57" id="ent0025"><path d="M837.23,341.4379 L837.23,422.262 A0,0 0 0 0 837.23,422.262 L1108.5193,422.262 A0,0 0 0 0 1108.5193,422.262 L1108.5193,351.4379 L1098.5193,341.4379 L1043.72,341.4379 L1039.72,262.1079 L1035.72,341.4379 L837.23,341.4379 A0,0 0 0 0 837.23,341.4379" fill="#E8F5E9" style="stroke:#181818;stroke-width:0.5;"/><path d="M1098.5193,341.4379 L1098.5193,351.4379 L1108.5193,351.4379 L1098.5193,341.4379" fill="#E8F5E9" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="230.0612" x="853.344" y="360.3349">Small domain corpus? Lower its order</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="216.3202" x="860.2145" y="378.0409">(sparser data) and lean toward &#8473;_g;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="168.3762" x="848.5925" y="395.747">embeddings can instead be</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="67.8081" x="1020.3487" y="395.747">fine-tuned</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="250.2893" x="843.23" y="413.453">with EmbeddingTrainer::train_continued.</text></g><!--link gc to g--><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" data-link-type="dependency" data-source-line="35" id="lnk10"><path d="M144.88,105.5679 C144.88,128.2179 144.88,154.7279 144.88,179.4479" fill="none" id="gc-to-g" style="stroke:#37474F;stroke-width:1;"/><polygon fill="#37474F" points="144.88,184.4479,148.88,175.4479,144.88,179.4479,140.88,175.4479,144.88,184.4479" style="stroke:#37474F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link dc to d--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" data-link-type="dependency" data-source-line="36" id="lnk11"><path d="M1012.88,105.5679 C1012.88,128.2179 1012.88,154.7279 1012.88,179.4479" fill="none" id="dc-to-d" style="stroke:#37474F;stroke-width:1;"/><polygon fill="#37474F" points="1012.88,184.4479,101