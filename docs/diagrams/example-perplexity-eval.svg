<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="625px" preserveAspectRatio="none" style="width:926px;height:625px;background:#FAFAFA;" version="1.1" viewBox="0 0 926 625" width="926px" zoomAndPan="magnify"><?plantuml $version$?><defs/><g><rect fill="#FAFAFA" height="625" style="stroke:none;stroke-width:1;" width="926" x="0" y="0"/><g class="title" data-source-line="19"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="499.1541" x="210.1755" y="24.9659">Perplexity &#8212; one streaming pass &#183; log-space accumulation &#183; a single exp</text></g><!--entity corpus--><g class="entity" data-qualified-name="corpus" data-source-line="21" id="ent0001"><rect fill="#546E7A" height="58.1358" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="252.5811" x="21.84" y="47.0679"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="78.3857" x="108.9377" y="72.0339">test corpus</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="232.5811" x="31.84" y="91.1018">held out &#8212; never seen in training</text></g><!--entity sent--><g class="entity" data-qualified-name="sent" data-source-line="22" id="ent0002"><rect fill="#546E7A" height="77.2038" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="207.8768" x="44.19" y="193.5679"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="130.5215" x="82.8676" y="218.5339">reader.sentences()</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="187.8768" x="54.19" y="237.6018">lowercased &#183; split on [.!?]+&#9251;</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="134.0215" x="81.1177" y="256.6697">(min 10 characters)</text></g><!--entity tok--><g class="entity" data-qualified-name="tok" data-source-line="23" id="ent0003"><rect fill="#546E7A" height="77.2038" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="282.2609" x="7" y="368.6779"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="192.6393" x="51.8108" y="393.6439">sentence.split_whitespace()</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="117.3055" x="89.4777" y="412.7118">tokens w&#8321; &#8230; w_N</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="100.7996" x="17" y="431.7797">punctuation is</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="23.9259" x="121.4396" y="431.7797">not</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="130.2555" x="149.0055" y="431.7797">stripped here &#8212; &#167;5</text></g><!--entity ctx--><g class="entity" data-qualified-name="ctx" data-source-line="25" id="ent0004"><rect fill="#1565C0" height="77.2038" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="258.5295" x="74.87" y="524.9479"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="112.1675" x="148.051" y="549.9139">context window</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="238.5295" x="84.87" y="568.9818">h&#7522; = the &#8804; n&#8722;1 tokens preceding w&#7522;</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="218.9591" x="94.6552" y="588.0497">(clamped at the sentence start)</text></g><!--entity lp--><g class="entity" data-qualified-name="lp" data-source-line="26" id="ent0005"><rect fill="#1565C0" height="77.2038" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="222.4112" x="336.92" y="193.5679"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="151.5774" x="372.3369" y="218.5339">model.log_prob(w&#7522;, h&#7522;)</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="202.4112" x="346.92" y="237.6018">Modified Kneser-Ney backoff</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="167.7894" x="364.2309" y="256.6697">always finite, always &lt; 0</text></g><!--entity acc--><g class="entity" data-qualified-name="acc" data-source-line="28" id="ent0006"><rect fill="#455A64" height="96.2717" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="207.3458" x="395.46" y="359.1479"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="81.6757" x="458.2951" y="384.1139">accumulate</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="136.092" x="431.0869" y="403.1818">&#931; &#8592; &#931; + log &#8473;(w&#7522; | h&#7522;)</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="65.0703" x="466.5978" y="422.2497">N &#8592; N + 1</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="187.3458" x="405.46" y="441.3176">OOV++ if log &#8473; &#8804; log(1/|V|)</text></g><!--entity res--><g class="entity" data-qualified-name="res" data-source-line="29" id="ent0007"><rect fill="#00838F" height="96.2717" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="261.4571" x="368.4" y="515.4179"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="114.9536" x="441.6518" y="540.3839">PerplexityResult</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="161.9794" x="418.1389" y="559.4518">perplexity = exp(&#8722;&#931; / N)</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="241.4571" x="378.4" y="578.5197">oov_count &#183; oov_rate &#183; total_tokens</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="220.2611" x="388.998" y="597.5876">total_log_prob &#183; sentence_count</text></g><g class="entity" data-qualified-name="GMN15" data-source-line="40" id="ent0016"><path d="M594.64,165.1979 L594.64,227.6879 L559.46,231.6879 L594.64,235.6879 L594.64,299.14 A0,0 0 0 0 594.64,299.14 L837.6152,299.14 A0,0 0 0 0 837.6152,299.14 L837.6152,175.1979 L827.6152,165.1979 L594.64,165.1979 A0,0 0 0 0 594.64,165.1979" fill="#E3F2FD" style="stroke:#181818;stroke-width:0.5;"/><path d="M827.6152,165.1979 L827.6152,175.1979 L837.6152,175.1979 L827.6152,165.1979" fill="#E3F2FD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="191.8672" x="615.694" y="184.0949">The recursion terminates in the</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="221.9752" x="600.64" y="201.8009">strictly-positive unigram term 1/|V|,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="219.2452" x="602.005" y="219.507">so &#8473; &gt; 0 always, log &#8473; never reaches</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="188.9943" x="617.1305" y="237.213">&#8722;&#8734;, and PP is always finite. The</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="206.0242" x="608.6155" y="254.919">backoff weight &#955;(h) &lt; 1 scales that</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="218.8292" x="602.213" y="272.625">term down &#8212; which is why the OOV</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="132.0787" x="645.5883" y="290.331">test below is &#8804;, not =.</text></g><g class="entity" data-qualified-name="GMN18" data-source-line="50" id="ent0019"><path d="M664.76,531.9979 L664.76,595.116 L911.5052,595.116 L911.5052,541.9979 L901.5052,531.9979 L664.76,531.9979" fill="#ECEFF1" style="stroke:#181818;stroke-width:0.5;"/><path d="M901.5052,531.9979 L901.5052,541.9979 L911.5052,541.9979 L901.5052,531.9979" fill="#ECEFF1" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="201.9682" x="682.6485" y="550.8949">Summing logs (never multiplying</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="176.5401" x="695.3625" y="568.6009">probabilities) is what keeps a</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="225.7452" x="670.76" y="586.307">10&#8310;-token corpus from underflowing.</text></g><!--link corpus to sent--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="dependency" data-source-line="31" id="lnk8"><path d="M148.13,105.4879 C148.13,130.2879 148.13,161.0279 148.13,188.2279" fill="none" id="corpus-to-sent" style="stroke:#37474F;stroke-width:1;"/><polygon fill="#37474F" points="148.13,193.2279,152.13,184.2279,148.13,188.2279,144.13,184.2279,148.13,193.2279" style="stroke:#37474F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link sent to tok--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="32" id="lnk9"><path d="M148.13,271.0379 C148.13,299.9579 148.13,334.2579 148.13,363.2279" fill="none" id="sent-to-tok" style="stroke:#37474F;stroke-width:1;"/><polygon fill="#37474F" points="148.13,368.2279,152.13,359.2279,148.13,363.2279,144.13,359.2279,148.13,368.2279" style="stroke:#37474F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link tok to ctx--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" data-source-line="33" id="lnk10"><path d="M182.06,446.3079 C182.06,470.1779 182.06,495.5979 182.06,519.4779" fill="none" id="tok-to-ctx" style="stroke:#37474F;stroke-width:1;"/><polygon fill="#37474F" points="182.06,524.4779,186.06,515.4779,182.06,519.4779,178.06,515.4779,182.06,524.4779" style="stroke:#37474F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#37474F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="72.9951" x="109.06" y="481.2949">for i = 1 &#8230; N</text></g><!--link ctx to lp--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" data-link-type="dependency" data-source-line="34" id="lnk11"><path d="M333.85,563.6879 C345.3,563.6879 352.66,563.6879 352.66,563.6879 C352.66,563.6879 352.66,363.8079 352.66,276.1779" fill="none" id="ctx-to-lp" style="stroke:#37474F;stroke-width:1;"/><polygon fill="#37474F" points="352.66,271.1779,348.66,280.1779,352.66,276.1779,356.66,280.1779,352.66,271.1779" style="stroke:#37474F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link lp to acc--><g class="link" data-entity-1="ent0005" data-entity-2="ent0006" data-link-type="dependency" data-source-line="35" id="lnk12"><path d="M477.4,271.0379 C477.4,296.9279 477.4,326.1579 477.4,353.8279" fill="none" id="lp-to-acc" style="stroke:#37474F;stroke-width:1;"/><polygon fill="#37474F" points="477.4,358.8279,481.4,349.8279,477.4,353.8279,473.4,349.8279,477.