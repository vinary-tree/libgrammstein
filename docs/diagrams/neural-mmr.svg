<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="863px" preserveAspectRatio="none" style="width:884px;height:863px;background:#FAFAFA;" version="1.1" viewBox="0 0 884 863" width="884px" zoomAndPan="magnify"><?plantuml $version$?><defs/><g><rect fill="#FAFAFA" height="863" style="stroke:none;stroke-width:1;" width="884" x="0" y="0"/><g class="title" data-source-line="18"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="290.1349" x="127.9528" y="24.9659">Maximal Marginal Relevance &#8212; centrality</text><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="43.0638" x="421.7277" y="24.9659">minus</text><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="281.1049" x="468.4315" y="24.9659">redundancy  (&#955; = 1 &#8722; diversity_threshold)</text></g><!--entity cand--><g class="entity" data-qualified-name="cand" data-source-line="20" id="ent0001"><rect fill="#2E7D32" height="77.2038" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="189.0493" x="594.22" y="47.0679"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="109.1016" x="634.1939" y="72.0339">Candidate set R</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="169.0493" x="604.22" y="91.1018">sentence vectors v&#8321; &#8230; v&#8345;</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="167.9994" x="604.745" y="110.1697">(&#8467;&#8322;-normalized, 768-dim)</text></g><!--entity centroid--><g class="entity" data-qualified-name="centroid" data-source-line="21" id="ent0002"><rect fill="#1565C0" height="77.2038" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="191.9193" x="443.79" y="184.2679"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="71.4277" x="504.0358" y="209.2339">Centroid c</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="166.4314" x="456.534" y="228.3018">c = v&#772; / &#8214;v&#772;&#8214;,   v&#772; = (1/n) &#931;&#7522; v&#7522;</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-style="italic" font-weight="700" lengthAdjust="spacing" textLength="171.9193" x="453.79" y="247.3697">stands in for MMR's query</text></g><!--entity rel--><g class="entity" data-qualified-name="rel" data-source-line="22" id="ent0003"><rect fill="#1565C0" height="77.2038" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="234.3112" x="422.59" y="321.4679"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="71.1337" x="504.1787" y="346.4339">Relevance</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="111.3696" x="484.0608" y="365.5018">rel(s&#7522;) = cos(v&#7522;, c)</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="214.3112" x="432.59" y="384.5697">&#8220;how central is this sentence?&#8221;</text></g><!--entity red--><g class="entity" data-qualified-name="red" data-source-line="23" id="ent0004"><rect fill="#EF6C00" height="96.2717" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="223.4892" x="647" y="753.0479"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="86.1416" x="715.6738" y="778.0139">Redundancy</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="153.2994" x="682.0949" y="797.0818">red(s&#7522;) = max cos(v&#7522;, v&#11388;)</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="37.2887" x="760.1202" y="816.1497">s&#11388; &#8712; S</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="203.4892" x="657" y="835.2176">&#8220;how much does it repeat S?&#8221;</text></g><!--entity mmr--><g class="entity" data-qualified-name="mmr" data-source-line="24" id="ent0005"><rect fill="#2E7D32" height="58.1358" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="172.9914" x="383.25" y="458.6779"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="76.8457" x="431.3229" y="483.6439">MMR score</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="152.9914" x="393.25" y="502.7118">&#955;&#183;rel(s&#7522;) &#8722; (1 &#8722; &#955;)&#183;red(s&#7522;)</text></g><!--entity sel--><g class="entity" data-qualified-name="sel" data-source-line="25" id="ent0006"><rect fill="#6A1B9A" height="77.2038" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="184.4714" x="14.51" y="596.3279"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="95.5636" x="58.9639" y="621.2939">Selected set S</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="164.4714" x="24.51" y="640.3618">seeded with argmax rel</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="141.8754" x="35.808" y="659.4297">then grown greedily</text></g><!--entity out--><g class="entity" data-qualified-name="out" data-source-line="26" id="ent0007"><rect fill="#6A1B9A" height="96.2717" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="199.4933" x="7" y="753.0479"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="66.7518" x="73.3708" y="778.0139">Summary</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="151.8294" x="30.832" y="797.0818">num_sentences picks;</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="152.7814" x="30.356" y="816.1497">re-ordered by original</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="179.4933" x="17" y="835.2176">position if preserve_order</text></g><g class="entity" data-qualified-name="GMN18" data-source-line="40" id="ent0019"><path d="M234.01,576.8079 L234.01,693.044 A0,0 0 0 0 234.01,693.044 L705.4864,693.044 A0,0 0 0 0 705.4864,693.044 L705.4864,586.8079 L695.4864,576.8079 L473.75,576.8079 L469.75,517.1779 L465.75,576.8079 L234.01,576.8079 A0,0 0 0 0 234.01,576.8079" fill="#E8F5E9" style="stroke:#181818;stroke-width:0.5;"/><path d="M695.4864,576.8079 L695.4864,586.8079 L705.4864,586.8079 L695.4864,576.8079" fill="#E8F5E9" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="450.4764" x="240.01" y="595.7049">&#955; = 1: pure centrality &#8212; the summary may say the same thing three times.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="317.4473" x="306.5246" y="613.4109">&#955; = 0: pure novelty &#8212; the summary drifts to outliers.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="218.8499" x="332.2997" y="631.117">Default diversity_threshold = 0.3 &#10233;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="40.183" x="554.5296" y="631.117">&#955; = 0.7</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.484" x="594.7127" y="631.117">.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="409.9695" x="260.2634" y="648.823">The first pick has S = &#8709;, so it is chosen on relevance alone; the code</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="423.0333" x="253.7316" y="666.529">seeds S with argmax rel before the loop, which makes the max over S</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="191.5031" x="369.4966" y="684.235">well-defined at every later step.</text></g><!--link cand to centroid--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="dependency" data-source-line="28" id="lnk8"><path d="M614.96,124.6179 C614.96,143.1579 614.96,160.2679 614.96,178.8179" fill="none" id="cand-to-centroid" style="stroke:#37474F;stroke-width:1;"/><polygon fill="#37474F" points="614.96,183.8179,618.96,174.8179,614.96,178.8179,610.96,174.8179,614.96,183.8179" style="stroke:#37474F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#37474F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="134.0171" x="479.96" y="150.1149">mean, then normalize</text></g><!--link centroid to rel--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="29" id="lnk9"><path d="M539.75,261.8179 C539.75,280.3579 539.75,297.4779 539.75,316.0279" fill="none" id="centroid-to-rel" style="stroke:#37474F;stroke-width:1;"/><polygon fill="#37474F" points="539.75,321.0279,543.75,312.0279,539.75,316.0279,535.75,312.0279,539.75,321.0279" style="stroke:#37474F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link cand to rel--><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" data-link-type="dependency" data-source-line="30" id="lnk10"><path d="M646.3,124.6879 C646.3,176.9179 646.3,264.0179 646.3,316.1779" fill="none" id="cand-to-rel" style="stroke:#37474F;stroke-width:1;"/><polygon fill="#37474F" points="646.3,321.1779,650.3,312.1779,646.3,316.1779,642.3,312.1779,646.3,321.1779" style="stroke:#37474F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link cand to red--><g class="link" data-entity-1="ent0001" data-entity-2="ent0004" data-link-type="dependency" data-source-line="31" id="lnk11"><path d="M757.34,124.6379 C757.34,246.3979 757.34,614.4379 757.34,747.9879" fill="none" id="cand-to-red" style="stroke:#37474F;stroke-width:1;"/><polygon fill="#37474F" points="757.34,752.9879,761.34,743.9879,757.34,747.9879,753.34,743.9879,757.34,752.9879" style="stroke:#37474F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link sel to red--><g class="link" data-entity-1="ent0006" data-entity-2="ent0004" data-link-type="dependency" data-source-line="32" id="lnk12"><path d="M199.43,635.3179 C211.76,635.3179 220.25,635.3179 220.25,635.3179 C220.25,635.3179 220.25,801.3179 220.25,801.3179 C220.25,801.3179 483.7,801.3179 641.52,801.3179" fill="none" id="sel-to-red" style="stroke:#37474F;stroke-width:1;"/><polygon fill="#37474F" points="646.52,801.3179,637.52,797.3179,641.52,801.3179,637.52,805.3179,646.52,801.3179" style="stroke:#37474F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#37474F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="102.5181" x="357.0185" y="779.2149">compare against</text><text fill="#37474F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="134.6151" x="340.97" y="796.9209">each chosen sentence</text></g><!--link rel to mmr--><g class="link" data-entity-1="ent0003" data-entity-2="ent0005" data-link-type="dependency" data-source-line="33" id="lnk13"><path d="M489.42,399.0679 C489.42,418.1379 489.42,435.7079 489.42,453.2979" fill="none" id="rel-to-mmr" style="stroke:#37474F;stroke-width:1;"/><polygon fill="#37474F" points="489.42,458.2979,493.42,449.2979,489.42,453.2979,485.42,449.2979,489.42,458.2979" style="stroke:#37474F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#37474F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="51.7531" x="437.42" y="424.5849">weight &#955;</text></g><!--link red to mmr--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" data-link-type="dependency" data-source-line="34" id="lnk14"><path d="M731.41,752.8279 C731.41,664.7879 731.41,487.3179 731.41,487.3179 C731.41,487.3179 637.68,487.3179 561.51,487.3179" fill="none" id="red-to-mmr" style="stroke:#37474F;stroke-width:1;"/><polygon fill="#37474F" points="556.51,487.3179,565.51,491.3179,561.51,487.3179,565.51,483.3179,556.51,487.3179" style="stroke:#37474F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#37474F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="88.6211" x="642.41" y="528.5249">weight &#8722;(1 &#8722; &#955;)</text></g><!--link mmr to sel--><g class="link" data-entity-1="ent0005" data-entity-2="ent0006" data-link-type="dependency" data-source-line="35" id="lnk15"><path d="M382.85,478.3179 C266.9,478.3179 76,478.3179 76,478.3179 C76,478.3179 76,544.8379 76,591.2179" fill="none" id="mmr-to-sel" style="stroke:#37474F;stroke-width:1;"/><polygon fill="#37474F" points="76,596.2179,80,587.2179,76,591.2179,72,587.2179,76,596.2179" style="stroke:#37474F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#37474F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="111.1724" x="58.48" y="474.2149">argmax over R &#8726; S</text></g><!--link sel to mmr--><g class="link" data-entity-1="ent0006" data-entity-2="ent0005" data-link-type="dependency" data-source-line="36" id="lnk16"><path d="M137.49,595.8579 C137.49,555.1779 137.49,497.3179 137.49,497.3179 C137.49,497.3179 279.44,497.3179 377.88,497.3179" fill="none" id="sel-to-mmr" style="stroke:#37474F;stroke-width:1;"/><polygon fill="#37474F" points="382.88,497.3179,373.88,493.3179,377.88,497.3179,373.88,501.3179,382.88,497.3179" style="stroke:#37474F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#37474F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="192.4132" x="17.92" y="493.2149">loop until |S| = num_sentences</text></g><!--link sel to out--><g class="link" data-entity-1="ent0006" data-entity-2="ent0007" data-link-type="dependency" data-source-line="37" id="lnk17"><path d="M106.75,673.9079 C106.75,697.4179 106.75,722.5779 106.75,747.6279" fill="none" id="sel-to-out" style="stroke:#37474F;stroke-width:1;"/><polygon fill="#37474F" points="106.75,752.6279,110.75,743.6279,106.75,747.6279,102.75,743.6279,106.75,752.6279" style="stroke:#37474F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><?plantuml-src VLPDRoD54BtFhoXb3x6jsCvtibajA9kDEUKIxz5Ir9bkUrgPwJRTFNPcMQGGBLBEW5P20Y6116SE2A5msZFAVy2_X5Sp_beJIAJnkAkwNdNrgrTUfpDnhJEHujCDjC7BkKhLI9XOaV0K4aK-ppBXz6lbI1iVX0bQ1EL9XwFIllPfhbonHhRFNwDriavNeSxEpgblNPQd8cXhI7joQfYAM4cwBChDqiPvfaoW60zdjTmWR-4roo5JmdZ4BCqYrQ5eqITEALaG4ix4DOrrI4XWYyoDn9w2XWhW0Gu3mGcNE29rIiYYwH4v3i3tAhGGzrmPgTmH8IiJyYobPl2Z0QVbsrABWHEPRnkL0xkPPQurX0-sTMtka1qVsUN0nocfemUvKxI5AbNxOviDhK7YimZjHIbRcQJtl-os8d-bpL00XYv5V3Lm5gSuiIdYFUaSy_-IXq-4j6Dj1jGNgLTB5gdw8a_3AtKTZbCzCFEIAhVabMgZGZ54tYuaTidWK1DX1gcYpoAYZZMXIc6SwA2cAzrGm7vfKuc55zQXRDCyj_TtjdSEiJfDtXbGPMix-dm9uTWvEvxwxnpi7knsLeqBr9b3q068_qFGoSqtIyIWHYFJ9lUDnZ8PgFPmJyznAvExhqZgaN8UlXSXSSedE4mzYXQdNsiqJeIHMeBWp10wRpHwndCT6My4H-iyZIQtNm3yPtxvjcTgaxTVJsvlcmPKHoQl5KXyi7_Ob3ghht4NnOY9CfqUlDpPNa6RifvY1egHwEYljzH6y7TumNE3g5nwJhMjjgdJmqz___OZZV3ecNQRkr5w9XmJ4EssxgdindQx0fw5VxArjxztilaX-BoGZ8sMgtc4hGCgjhx641iKrtjcSlDTOiUpGdCJXmIFMLK-djnyNu8Xmd_Xp6wZ0f9p8ExV1TXeykkVmAF5dySABkwEklCqiZnEq5wb_h2QA16ekvG3pdhQsJ_PNCc1fSZ7rfL