<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="1130px" preserveAspectRatio="none" style="width:431px;height:1130px;background:#FAFAFA;" version="1.1" viewBox="0 0 431 1130" width="431px" zoomAndPan="magnify"><?plantuml $version$?><defs/><g><rect fill="#FAFAFA" height="1130" style="stroke:none;stroke-width:1;" width="431" x="0" y="0"/><g class="title" data-source-line="22"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="404.9485" x="10" y="24.9659">Correction pipeline &#8212; four layers transforming one lattice</text></g><g class="legend" data-source-line="42"><rect fill="none" height="109.3396" rx="7.5" ry="7.5" style="stroke:#000000;stroke-width:1;" width="344.0387" x="43.6749" y="52.0679"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="43.8338" x="52.3148" y="74.0339">Colour</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="37.0999" x="103.4286" y="74.0339">Stage</text><rect fill="#455A64" height="19.0679" style="stroke:none;stroke-width:1;" width="51.1138" x="48.6749" y="78.1358"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="3.64" x="48.6749" y="93.1018">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="194.0378" x="103.4286" y="93.1018">text &#8644; lattice (tokenize / emit)</text><rect fill="#1565C0" height="19.0679" style="stroke:none;stroke-width:1;" width="51.1138" x="48.6749" y="97.2038"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="3.64" x="48.6749" y="112.1697">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="251.719" x="103.4286" y="112.1697">spelling &#8212; liblevenshtein edit distance</text><rect fill="#6A1B9A" height="19.0679" style="stroke:none;stroke-width:1;" width="51.1138" x="48.6749" y="116.2717"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="3.64" x="48.6749" y="131.2376">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="212.6452" x="103.4286" y="131.2376">grammar &#8212; lling-llang CFG filter</text><rect fill="#2E7D32" height="19.0679" style="stroke:none;stroke-width:1;" width="51.1138" x="48.6749" y="135.3396"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="3.64" x="48.6749" y="150.3055">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="275.6449" x="103.4286" y="150.3055">fluency &#8212; libgrammstein language model</text><line style="stroke:#000000;stroke-width:1;" x1="48.6749" x2="382.7135" y1="59.0679" y2="59.0679"/><line style="stroke:#000000;stroke-width:1;" x1="48.6749" x2="382.7135" y1="78.1358" y2="78.1358"/><line style="stroke:#000000;stroke-width:1;" x1="48.6749" x2="382.7135" y1="97.2038" y2="97.2038"/><line style="stroke:#000000;stroke-width:1;" x1="48.6749" x2="382.7135" y1="116.2717" y2="116.2717"/><line style="stroke:#000000;stroke-width:1;" x1="48.6749" x2="382.7135" y1="135.3396" y2="135.3396"/><line style="stroke:#000000;stroke-width:1;" x1="48.6749" x2="382.7135" y1="154.4075" y2="154.4075"/><line style="stroke:#000000;stroke-width:1;" x1="48.6749" x2="48.6749" y1="59.0679" y2="154.4075"/><line style="stroke:#000000;stroke-width:1;" x1="99.7887" x2="99.7887" y1="59.0679" y2="154.4075"/><line style="stroke:#000000;stroke-width:1;" x1="382.7135" x2="382.7135" y1="59.0679" y2="154.4075"/></g><!--entity in--><g class="entity" data-qualified-name="in" data-source-line="24" id="ent0001"><rect fill="#455A64" height="58.1358" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="172.1514" x="126.3949" y="181.4075"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="70.8117" x="177.0648" y="206.3734">Input text</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="152.1514" x="136.3949" y="225.4414">&#8220;teh quikc brwon fox&#8221;</text></g><!--entity tok--><g class="entity" data-qualified-name="tok" data-source-line="26" id="ent0002"><rect fill="#455A64" height="77.2038" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="338.5267" x="43.2149" y="299.5375"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="148.5955" x="138.1805" y="324.5034">Layer 1: Tokenization</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="318.5267" x="53.2149" y="343.5714">convert text to an initial lattice with one path</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="210.7692" x="107.0937" y="362.6393">[&#8220;teh&#8221;, &#8220;quikc&#8221;, &#8220;brwon&#8221;, &#8220;fox&#8221;]</text></g><!--entity spell--><g class="entity" data-qualified-name="spell" data-source-line="28" id="ent0003"><rect fill="#1565C0" height="191.6113" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="360.4786" x="32.2349" y="436.7475"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="191.0293" x="59.0558" y="461.7134">Layer 2: Spelling Correction</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="108.5276" x="257.3651" y="461.7134">(liblevenshtein)</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="340.4786" x="42.2349" y="480.7814">add fuzzy-matching alternatives at each position</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="3.64" x="210.6542" y="499.8493">&#160;</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="243.4716" x="90.7384" y="518.9172">Position 0:  teh   &#8594; [the, tea, ten, &#8230;]</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="253.4535" x="85.7475" y="537.9851">Position 1:  quikc &#8594; [quick, quack, &#8230;]</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="269.5955" x="77.6765" y="557.053">Position 2:  brwon &#8594; [brown, brawn, &#8230;]</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="226.6297" x="99.1594" y="576.1209">Position 3:  fox   &#8594; [fox]  (correct)</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="3.64" x="210.6542" y="595.1889">&#160;</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="238.559" x="93.1947" y="614.2568">the lattice now has multiple paths</text></g><!--entity cfg--><g class="entity" data-qualified-name="cfg" data-source-line="30" id="ent0004"><rect fill="#6A1B9A" height="77.2038" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="326.7249" x="49.1149" y="688.3575"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="165.1434" x="92.3858" y="713.3234">Layer 3: Grammar Filter</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="67.7598" x="264.8091" y="713.3234">(optional)</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="288.9169" x="68.0189" y="732.3914">remove paths that violate grammar rules</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="306.7249" x="59.1149" y="751.4593">e.g. &#8220;the quack brown fox&#8221; might be filtered</text></g><!--entity lm--><g class="entity" data-qualified-name="lm" data-source-line="32" id="ent0005"><rect fill="#2E7D32" height="172.5433" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="316.3929" x="54.2749" y="825.5575"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="173.8653" x="65.7799" y="850.5234">Layer 4: Language Model</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="112.2376" x="246.9252" y="850.5234">(libgrammstein)</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="216.9151" x="104.0138" y="869.5914">rescore paths based on fluency</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="3.64" x="210.6514" y="888.6593">&#160;</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="270.1989" x="77.3719" y="907.7272">&#8473;(&#8220;the quick brown fox&#8221;) = &#8722;12.3  (high)</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="277.7729" x="73.5849" y="926.7951">&#8473;(&#8220;tea quick brown fox&#8221;) = &#8722;18.5  (lower)</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="296.3929" x="64.2749" y="945.863">&#8473;(&#8220;the quick brawn fox&#8221;) = &#8722;16.2  (medium)</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="3.64" x="210.6514" y="964.9309">&#160;</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="226.0851" x="99.4288" y="983.9989">best path: &#8220;the quick brown fox&#8221;</text></g><!--entity out--><g class="entity" data-qualified-name="out" data-source-line="34" id="ent0006"><rect fill="#455A64" height="58.1358" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="172.1514" x="126.3949" y="1058.0975"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="50.2738" x="187.3337" y="1083.0634">Output</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="152.1514" x="136.3949" y="1102.1314">&#8220;the quick brown fox&#8221;</text></g><!--link in to tok--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="dependency" data-source-line="36" id="lnk7"><path d="M212.4749,239.7575 C212.4749,257.4275 212.4749,275.1475 212.4749,294.3075" fill="none" id="in-to-tok" style="stroke:#37474F;stroke-width:1;"/><polygon fill="#37474F" points="212.4749,299.3075,216.4749,290.3075,212.4749,294.3075,208.4749,290.3075,212.4749,299.3075" style="stroke:#37474F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link tok to spell--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="37" id="lnk8"><path d="M212.4749,377.0175 C212.4749,394.2975 212.4749,410.4975 212.4749,431.6075" fill="none" id="tok-to-spell" style="stroke:#37474F;stroke-width:1;"/><polygon fill="#37474F" points="212.4749,436.6075,216.4749,427.6075,212.4749,431.6075,208.4749,427.6075,212.4749,436.6075" style="stroke:#37474F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#37474F" font-family="sans-serif" font-size="13" lengthAdjust="spacing