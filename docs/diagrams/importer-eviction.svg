<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="966px" preserveAspectRatio="none" style="width:660px;height:966px;background:#FAFAFA;" version="1.1" viewBox="0 0 660 966" width="660px" zoomAndPan="magnify"><?plantuml $version$?><defs/><g><rect fill="#FAFAFA" height="966" style="stroke:none;stroke-width:1;" width="660" x="0" y="0"/><g class="title" data-source-line="15"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="552.34" x="50.4027" y="24.9659">Google Books Importer &#8212; Sharded Lock-Free Ingestion + Overlay-Heap Eviction</text></g><!--cluster Per shard  ?(26 | 676)--><g class="cluster" data-qualified-name="Per shard  ..26 . 676." data-source-line="20" id="ent0003"><path d="M127.91,264.4079 L275.2934,264.4079 A3.75,3.75 0 0 1 277.7934,266.9079 L284.7934,289.4758 L428.91,289.4758 A2.5,2.5 0 0 1 431.41,291.9758 L431.41,520.7879 A2.5,2.5 0 0 1 428.91,523.2879 L127.91,523.2879 A2.5,2.5 0 0 1 125.41,520.7879 L125.41,266.9079 A2.5,2.5 0 0 1 127.91,264.4079" fill="none" style="stroke:#000000;stroke-width:1.5;"/><line style="stroke:#000000;stroke-width:1.5;" x1="125.41" x2="284.7934" y1="289.4758" y2="289.4758"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="146.3834" x="129.41" y="281.3739">Per shard  &#215;(26 | 676)</text></g><!--entity overlay--><g class="entity" data-qualified-name="Per shard  ..26 . 676..overlay" data-source-line="21" id="ent0004"><rect fill="#00838F" height="77.2038" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="239.3372" x="149.74" y="302.4079"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="120.9036" x="208.9568" y="327.3739">Lock-free overlay</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="194.2912" x="172.263" y="346.4418">DashMap + atomic counters</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="219.3372" x="159.74" y="365.5097">(high-concurrency write buffer)</text></g><!--entity shards--><g class="entity" data-qualified-name="Per shard  ..26 . 676..shards" data-source-line="22" id="ent0005"><rect fill="#00838F" height="58.1358" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="273.819" x="141.5" y="449.1479"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="163.8134" x="196.5028" y="474.1139">Persistent ARTrie shard</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="253.819" x="151.5" y="493.1818">mmap-backed &#183; CX path-compressed</text></g><!--entity corpus--><g class="entity" data-qualified-name="corpus" data-source-line="17" id="ent0001"><rect fill="#546E7A" height="77.2038" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="275.275" x="131.77" y="47.0679"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="182.3353" x="178.2399" y="72.0339">Google Books n-gram files</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="255.275" x="141.77" y="91.1018">.gz over HTTP &#183; 206 Range-resumable</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="138.5435" x="200.1358" y="110.1697">optional local cache</text></g><!--entity workers--><g class="entity" data-qualified-name="workers" data-source-line="18" id="ent0002"><rect fill="#1565C0" height="58.1358" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="249.1077" x="144.86" y="184.2779"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="86.0017" x="187.1711" y="209.2439">Worker pool</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="71.2037" x="280.4528" y="209.2439">(--parallel)</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="229.1077" x="154.86" y="228.3118">zero-alloc line parse &#8594; varint key</text></g><!--entity ckpt--><g class="entity" data-qualified-name="ckpt" data-source-line="25" id="ent0006"><rect fill="#00838F" height="77.2038" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="312.7949" x="162.01" y="576.8179"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="154.6154" x="217.0479" y="601.7839">Crash-safe checkpoint</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="40.8239" x="378.9432" y="601.7839">(cron)</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="187.7392" x="224.5378" y="620.8518">chunked tx &#183; SET semantics</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="292.7949" x="172.01" y="639.9197">(idempotent recovery) &#183; vocab WAL merge</text></g><!--entity evict--><g class="entity" data-qualified-name="evict" data-source-line="26" id="ent0007"><rect fill="#006064" height="96.2717" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="307.1669" x="164.83" y="714.0179"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="81.8157" x="277.5056" y="738.9839">Eviction tail</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="204.5797" x="216.1236" y="758.0518">evict coldest overlay nodes &#8594;</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="245.0815" x="195.8727" y="777.1197">budget &#247; resident shards (&#8805;64 MiB)</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="53.5638" x="174.83" y="796.1876">lossless</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="229.9631" x="232.0338" y="796.1876">&#8212; fault back from durable image</text></g><!--entity spec--><g class="entity" data-qualified-name="spec" data-source-line="28" id="ent0008"><rect fill="#C62828" height="77.2038" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="195.4753" x="450.67" y="439.6179"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="175.4753" x="460.67" y="464.5839">CheckpointStateMachine</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="171.3594" x="462.728" y="483.6518">PersistentStorageBridge</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="88.6897" x="504.0628" y="502.7197">TLA+ / TLAPS</text></g><g class="entity" data-qualified-name="GMN17" data-source-line="41" id="ent0018"><path d="M134.5,870.2979 L134.5,951.122 A0,0 0 0 0 134.5,951.122 L502.3273,951.122 A0,0 0 0 0 502.3273,951.122 L502.3273,880.2979 L492.3273,870.2979 L322.41,870.2979 L318.41,810.3879 L314.41,870.2979 L134.5,870.2979 A0,0 0 0 0 134.5,870.2979" fill="#FFF3E0" style="stroke:#181818;stroke-width:0.5;"/><path d="M492.3273,870.2979 L492.3273,880.2979 L502.3273,880.2979 L492.3273,870.2979" fill="#FFF3E0" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="197.5727" x="215.1273" y="889.1949">Peak heap: 33.79 GB &#8594; &lt; 16 GB.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="337.6624" x="145.0825" y="906.9009">The budget is the hard bound on resident overlay RAM;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="346.8273" x="140.5" y="924.607">`--overlay-budget-gib` (default 10). mimalloc removes the</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="211.0292" x="208.3991" y="942.313">~49% `__mprotect` CPU separately.</text></g><!--link corpus to workers--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="dependency" data-source-line="30" id="lnk9"><path d="M269.41,124.6679 C269.41,143.7379 269.41,161.3079 269.41,178.8979" fill="none" id="corpus-to-workers" style="stroke:#37474F;stroke-width:1;"/><polygon fill="#37474F" points="269.41,183.8979,273.41,174.8979,269.41,178.8979,265.41,174.8979,269.41,183.8979" style="stroke:#37474F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#37474F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="89.8041" x="179.41" y="150.1849">stream / cache</text></g><!--link workers to overlay--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" data-link-type="dependency" data-source-line="31" id="lnk10"><path d="M269.41,242.6379 C269.41,260.2979 269.41,278.0179 269.41,297.1779" fill="none" id="workers-to-overlay" style="stroke:#37474F;stroke-width:1;"/><polygon fill="#37474F" points="269.41,302.1779,273.41,293.1779,269.41,297.1779,265.41,293.1779,269.41,302.1779" style="stroke:#37474F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#37474F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="78.1041" x="144.4495" y="287.3049">store_ngram</text><text fill="#37474F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="170.1832" x="98.41" y="305.0109">(lock-free CAS, count = max)</text></g><!--link overlay to shards--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" data-link-type="dependency" data-source-line="32" id="lnk11"><path d="M269.41,379.9679 C269.41,401.8279 269.41,423.6679 269.41,443.7679" fill="none" id="overlay-to-shards" style="stroke:#37474F;stroke-width:1;"/><polygon fill="#37474F" points="269.41,448.7679,273.41,439.7679,269.41,443.7679,265.41,439.7679,269.41,448.7679" style="stroke:#37474F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#37474F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="60.6711" x="208.41" y="392.2649">flush over</text><text fill="#37474F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="58.9031" x="209.294" y="409.9709">threshold</text></g><!--link shards to ckpt--><g class="link" data-entity-1="ent0005" data-entity-2="ent0006" data-link-type="dependency" data-source-line="33" id="lnk12"><path d="M288.67,507.6479 C288.67,527.7279 288.67,549.5379 288.67,571.3979" fill="none" id="shards-to-ckpt" style="stroke:#37474F;stroke-width:1;"/><polygon fill="#37474F" points="288.67,576.3979,292.67,567.3979,288.67,571.3979,284.67,567.3979,288.67,576.3979" style="stroke:#37474F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#37474F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="49.504" x="213.448" y="519.9249">periodic</text><text fill="#37474F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="99.0601" x="188.67" y="537.6309">(every 5-10 files)</text></g><!--link ckpt to evict--><g class="link" data-entity-1="ent0006" data-entity-2="ent0007" data-link-type="dependency" data-source-line="34" id="lnk13"><path d="M318.41,654.3579 C318.41,672.5279 318.41,689.3379 318.41,708.5779" fill="none" id="ckpt-to-evict" style="stroke:#37474F;stroke-width:1;"/><polygon fill="#37474F" points="318.41,713.5779,322.41,704.5779,318.41,708.5779,314.41,704.5779,318.41,713.5779" style="stroke:#37474F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#37474F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="79.9111" x="238.41" y="661.8649">after durable</text><text fill="#37474F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="44.9931" x="255.869" y="679.5709">publish</text></g><!--link evict to overlay--><g class="link" data-entity-1="ent0007" data-entity-2="ent0004" data-link-type="dependency" data-source-line="35" id="lnk14"><path d="M164.62,762.1179 C148.58,762.1179 138,762.1179 138,762.1179 C138,762.1179 138,341.1179 138,341.1179 C138,341.1179 137.43,341.1179 144.66,341.1179" fill="none" id="evict-to-overlay" style="stroke:#006064;stroke-width:1;stroke-dasharray:7,7;"/><polygon fill="#006064" points="149.66,341.1179,140.66,337.1179,144.66,341.1179,140.66,345.1179,149.66,341.1179" style="stroke:#006064;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#37474F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="130.3771" x="7" y="554.9949">reclaim resident RAM</text></g><!--link spec to ckpt--><g class="link" data-entity-1="ent0008" data-entity-2="ent0006" data-link-type="dependency" data-source-line="37" id="lnk15"><path d="M462.74,517.1679 C462.74,535.7079 462.74,552.8179 462.74,571.3679" fill="none" id="spec-to-ckpt" style="stroke:#C62828;stroke-width:1;stroke-dasharray:7,7;"/><polygon fill="#C62828" points="462.74,576.3679,466.74,567.3679,462.74,571.3679,458.74,567.3679,462.74,576.3679" style="stroke:#C62828;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#37474F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="44.044" x="393.7835" y="524.6649">verifies</text><text fill="#37474F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="92.1311" x="369.74" y="542.3709">no-loss publish</text></g><!--link spec to evict--><g class="link" data-entity-1="ent0008" data-entity-2="ent0007" data-link-type="dependency" data-source-line="38" id="lnk16"><path d="M488.57,517.0979 C488.57,594.8479 488.57,762.1179 488.57,762.1179 C488.57,762.1179 487.33,762.1179 477.25,762.1179" fill="none" id="spec-to-evict" style="stroke:#C62828;stroke-width:1;stroke-dasharray:7,7;"/><polygon fill="#C62828" points="472.25,762.1179,481.25,766.1179,477.25,762.1179,481.25,758.1179,472.25,762.1179" style="stroke:#C62828;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#37474F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="44.044" x="516.3825" y="625.6649">verifies</text><text fill="#37474F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="97.6691" x="489.57" y="643.3709">lossless eviction</text></g></g></svg>