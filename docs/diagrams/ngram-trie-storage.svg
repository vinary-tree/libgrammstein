13" lengthAdjust="spacing" textLength="277.3812" x="463.27" y="352.7305">which would alias the metadata prefix and be</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="180.6351" x="511.643" y="370.4365">filtered out of every traversal.</text></g><g class="entity" data-qualified-name="GMN21" data-source-line="58" id="ent0022"><path d="M455.64,462.8575 L455.64,490.8375 L421.22,494.8375 L455.64,498.8375 L455.64,525.9756 A0,0 0 0 0 455.64,525.9756 L747.2742,525.9756 A0,0 0 0 0 747.2742,525.9756 L747.2742,472.8575 L737.2742,462.8575 L455.64,462.8575 A0,0 0 0 0 455.64,462.8575" fill="#E3F2FD" style="stroke:#181818;stroke-width:0.5;"/><path d="M737.2742,462.8575 L737.2742,472.8575 L747.2742,472.8575 L737.2742,462.8575" fill="#E3F2FD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="270.6342" x="461.64" y="481.7545">Zipf's law pays here: the ~127 most frequent</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="253.3052" x="470.3045" y="499.4605">words each cost a single byte, so a typical</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="151.2941" x="521.31" y="517.1665">5-gram key is ~5-8 bytes.</text></g><!--link toks to legacy--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="dependency" data-source-line="42" id="lnk10"><path d="M638.04,239.8075 C638.04,270.0575 638.04,312.8375 638.04,312.8375 C638.04,312.8375 709.25,312.8375 785.9,312.8375" fill="none" id="toks-to-legacy" style="stroke:#37474F;stroke-width:1;"/><polygon fill="#37474F" points="790.9,312.8375,781.9,308.8375,785.9,312.8375,781.9,316.8375,790.9,312.8375" style="stroke:#37474F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#37474F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="100.94