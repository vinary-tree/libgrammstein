<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="589px" preserveAspectRatio="none" style="width:1250px;height:589px;background:#FAFAFA;" version="1.1" viewBox="0 0 1250 589" width="1250px" zoomAndPan="magnify"><?plantuml $version$?><defs/><g><rect fill="#FAFAFA" height="589" style="stroke:none;stroke-width:1;" width="1250" x="0" y="0"/><g class="title" data-source-line="16"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="568.6918" x="337.5077" y="24.9659">N-dimensional approximate matching &#8212; heterogeneous axes fused by a semiring</text></g><!--entity nc--><g class="entity" data-qualified-name="nc" data-source-line="18" id="ent0001"><rect fill="#455A64" height="58.1358" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="186.3621" x="534.29" y="47.0679"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="96.1376" x="579.4022" y="72.0339">noisy channel</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="166.3621" x="544.29" y="91.1018">&#373; = argmax &#8473;(x&#9474;w)&#183;&#8473;(w)</text></g><!--entity d1--><g class="entity" data-qualified-name="d1" data-source-line="20" id="ent0002"><rect fill="#1565C0" height="77.2038" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="200.9493" x="7" y="165.2079"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="145.8654" x="34.5419" y="190.1739">DIM 1 &#183; Orthographic</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="161.2234" x="26.863" y="209.2418">edit distance (a metric)</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="180.9493" x="17" y="228.3097">liblevenshtein automaton</text></g><!--entity d2--><g class="entity" data-qualified-name="d2" data-source-line="21" id="ent0003"><rect fill="#1E88E5" height="77.2038" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="237.0692" x="242.94" y="165.2079"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="113.2456" x="304.8518" y="190.1739">DIM 2 &#183; Phonetic</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="141.3714" x="290.7889" y="209.2418">Zompist sound-alike</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="217.0692" x="252.94" y="228.3097">liblevenshtein + libgrammstein</text></g><!--entity d3--><g class="entity" data-qualified-name="d3" data-source-line="22" id="ent0004"><rect fill="#6A1B9A" height="77.2038" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="224.0492" x="515.45" y="165.2079"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="115.7375" x="569.6058" y="190.1739">DIM 3 &#183; Syntactic</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="204.0492" x="525.45" y="209.2418">CFG membership (constraint)</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="133.2655" x="560.8419" y="228.3097">lling-llang CfgFilter</text></g><!--entity d4--><g class="entity" data-qualified-name="d4" data-source-line="23" id="ent0005"><rect fill="#2E7D32" height="77.2038" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="214.6272" x="774.16" y="165.2079"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="128.8555" x="817.0459" y="190.1739">DIM 4 &#183; Contextual</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="176.3441" x="793.3016" y="209.2418">&#8722;log &#8473;(w&#9474;ctx) (likelihood)</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="194.6272" x="784.16" y="228.3097">libgrammstein MKN n-gram</text></g><!--entity d5--><g class="entity" data-qualified-name="d5" data-source-line="24" id="ent0006"><rect fill="#388E3C" height="77.2038" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="212.4572" x="1024.25" y="165.2079"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="116.4516" x="1072.2528" y="190.1739">DIM 5 &#183; Semantic</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="177.1958" x="1041.8807" y="209.2418">cos-similarity &#8594; pseudo-&#8473;</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="192.4572" x="1034.25" y="228.3097">libgrammstein embeddings</text></g><!--entity sr--><g class="entity" data-qualified-name="sr" data-source-line="26" id="ent0007"><rect fill="#00838F" height="96.2717" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="281.435" x="486.76" y="302.4079"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="62.2998" x="548.2953" y="327.3739">Semiring</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="88.7847" x="617.875" y="327.3739">(K, &#8853;, &#8855;, 0&#772;, 1&#772;)</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="226.2656" x="514.3447" y="346.4418">&#8855; combines factors along a path</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="237.7456" x="508.6047" y="365.5097">&#8853; selects among competing paths</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="261.435" x="496.76" y="384.5776">Tropical: (min, +)   Log: (logsumexp, +)</text></g><!--entity js--><g class="entity" data-qualified-name="js" data-source-line="27" id="ent0008"><rect fill="#455A64" height="58.1358" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="293.0129" x="317.97" y="487.7279"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="73.5417" x="427.7056" y="512.6939">joint score</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="273.0129" x="327.97" y="531.7618">best correction = shortest / max-&#8473; path</text></g><g class="entity" data-qualified-name="GMN20" data-source-line="43" id="ent0021"><path d="M645.77,458.6779 L645.77,574.914 A0,0 0 0 0 645.77,574.914 L937.1832,574.914 A0,0 0 0 0 937.1832,574.914 L937.1832,468.6779 L927.1832,458.6779 L710.98,458.6779 L706.98,399.0779 L702.98,458.6779 L645.77,458.6779 A0,0 0 0 0 645.77,458.6779" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M927.1832,458.6779 L927.1832,468.6779 L937.1832,468.6779 L927.1832,458.6779" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="119.9251" x="667.7145" y="477.5749">The dimensions are</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="98.8391" x="791.0196" y="477.5749">heterogeneous</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="13" x="893.2387" y="477.5749">&#8212;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="213.0442" x="680.4545" y="495.2809">metric / likelihood / constraint. The</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="232.6352" x="670.659" y="512.987">semiring is the common currency that</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="270.4132" x="651.77" y="530.693">makes them composable. Each independent</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="269.0988" x="652.4272" y="548.399">factor is one dimension &#8594; the WFST product</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="248.3912" x="662.781" y="566.105">construction makes the joint search N-D.</text></g><!--link nc to d1--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="dependency" data-source-line="29" id="lnk9"><path d="M533.91,66.9179 C384.2,66.9179 107.47,66.9179 107.47,66.9179 C107.47,66.9179 107.47,119.4779 107.47,159.9479" fill="none" id="nc-to-d1" style="stroke:#37474F;stroke-width:1;"/><polygon fill="#37474F" points="107.47,164.9479,111.47,155.9479,107.47,159.9479,103.47,155.9479,107.47,164.9479" style="stroke:#37474F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#37474F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="48.321" x="222.68" y="62.8149">channel</text></g><!--link nc to d2--><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" data-link-type="dependency" data-source-line="30" id="lnk10"><path d="M534.07,85.9179 C457.42,85.9179 361.47,85.9179 361.47,85.9179 C361.47,85.9179 361.47,125.5379 361.47,159.8779" fill="none" id="nc-to-d2" style="stroke:#37474F;stroke-width:1;"/><polygon fill="#37474F" points="361.47,164.8779,365.47,155.8779,361.47,159.8779,357.47,155.8779,361.47,164.8779" style="stroke:#3