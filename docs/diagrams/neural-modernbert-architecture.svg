<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="1117px" preserveAspectRatio="none" style="width:1020px;height:1117px;background:#FAFAFA;" version="1.1" viewBox="0 0 1020 1117" width="1020px" zoomAndPan="magnify"><?plantuml $version$?><defs/><g><rect fill="#FAFAFA" height="1117" style="stroke:none;stroke-width:1;" width="1020" x="0" y="0"/><g class="title" data-source-line="19"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="534.0559" x="239.6711" y="24.9659">ModernBERT-base &#8212; encoder stack and the two exits used by libgrammstein</text></g><!--entity text--><g class="entity" data-qualified-name="text" data-source-line="21" id="ent0001"><rect fill="#546E7A" height="58.1358" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="174.1534" x="428.5" y="47.0679"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="70.8117" x="480.1708" y="72.0339">Input text</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="154.1534" x="438.5" y="91.1018">&#8220;The quick brown fox&#8221;</text></g><!--entity tok--><g class="entity" data-qualified-name="tok" data-source-line="23" id="ent0002"><rect fill="#2E7D32" height="77.2038" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="241.4791" x="394.84" y="165.1979"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="68.6698" x="415.13" y="190.1639">Tokenizer</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="128.5895" x="487.4397" y="190.1639">(BPE, 50 368 types)</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="221.4791" x="404.84" y="209.2318">encode(text, add_special = true)</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="185.7737" x="422.6927" y="228.2997">&#10230; [CLS] &#183; sub-words &#183; [SEP]</text></g><!--entity emb--><g class="entity" data-qualified-name="emb" data-source-line="25" id="ent0003"><rect fill="#2E7D32" height="77.2038" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="305.5848" x="362.79" y="302.4079"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="132.6775" x="402.1689" y="327.3739">Token embeddings</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="90.5097" x="538.4863" y="327.3739">+ LayerNorm</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="151.5562" x="439.8043" y="346.4418">E &#8712; &#8477;^(V &#215; H),  H = 768</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="285.5848" x="372.79" y="365.5097">no absolute positions &#183; no token-type IDs</text></g><!--entity enc--><g class="entity" data-qualified-name="enc" data-source-line="27" id="ent0004"><rect fill="#2E7D32" height="115.3396" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="253.9671" x="388.59" y="439.6079"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="208.8512" x="411.148" y="464.5739">Encoder &#8212; 22 pre-norm layers</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="198.5752" x="416.2859" y="483.6418">attention: RoPE-rotated Q&#183;K&#7488;</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="197.3656" x="416.8907" y="502.7097">layer &#8467; global &#10234; &#8467; mod 3 = 0</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="233.9671" x="398.59" y="521.7776">other layers: sliding window (&#177;64)</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="223.1171" x="404.015" y="540.8455">MLP: GeGLU, intermediate 1 152</text></g><!--entity hid--><g class="entity" data-qualified-name="hid" data-source-line="29" id="ent0005"><rect fill="#2E7D32" height="58.1358" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="252.3359" x="389.41" y="614.9479"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="74.7737" x="478.1911" y="639.9139">final_norm</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="232.3359" x="399.41" y="658.9818">hidden states  H &#8712; &#8477;^(B &#215; T &#215; 768)</text></g><!--entity pool--><g class="entity" data-qualified-name="pool" data-source-line="31" id="ent0006"><rect fill="#2E7D32" height="58.1358" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="198.9753" x="767.09" y="770.9879"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="52.4998" x="840.3278" y="795.9539">Pooling</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="178.9753" x="777.09" y="815.0218">CLS: h&#8320;      mean: (1/T) &#931;&#8348; h&#8348;</text></g><!--entity vec--><g class="entity" data-qualified-name="vec" data-source-line="32" id="ent0007"><rect fill="#2E7D32" height="58.1358" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="248.5631" x="742.3" y="927.0279"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="112.5876" x="810.2878" y="951.9939">Sentence vector</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="228.5631" x="752.3" y="971.0618">&#8477;^768  (optionally &#8467;&#8322;-normalized)</text></g><!--entity head--><g class="entity" data-qualified-name="head" data-source-line="34" id="ent0008"><rect fill="#2E7D32" height="58.1358" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="315.1564" x="7" y="770.9879"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="72.5617" x="86.3745" y="795.9539">MLM head</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="80.2057" x="162.5762" y="795.9539">(replicated)</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="295.1564" x="17" y="815.0218">Dense(768&#8594;768) &#8594; GELU(erf) &#8594; LayerNorm</text></g><!--entity dec--><g class="entity" data-qualified-name="dec" data-source-line="35" id="ent0009"><rect fill="#2E7D32" height="58.1358" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="248.8515" x="40.15" y="927.0279"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="58.0438" x="70.6711" y="951.9939">Decoder</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="126.1255" x="132.3549" y="951.9939">(weights tied to E)</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="228.8515" x="50.15" y="971.0618">z = E&#7488;&#183;x + b   &#10230;  &#8477;^(B &#215; T &#215; 50 368)</text></g><!--entity logits--><g class="entity" data-qualified-name="logits" data-source-line="36" id="ent0010"><rect fill="#2E7D32" height="58.1358" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="284.7053" x="22.23" y="1045.1579"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="120.9175" x="104.1239" y="1070.1239">Vocabulary logits</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="264.7053" x="32.23" y="1089.1918">log-softmax &#10230; log &#8473;(token | context)</text></g><g class="entity" data-qualified-name="GMN20" data-source-line="51" id="ent0021"><path d="M677.49,456.8679 L677.49,493.2979 L642.84,497.2979 L677.49,501.2979 L677.49,537.692 A0,0 0 0 0 677.49,537.692 L981.6598,537.692 A0,0 0 0 0 981.6598,537.692 L981.6598,466.8679 L971.6598,456.8679 L677.49,456.8679 A0,0 0 0 0 677.49,456.8679" fill="#E8F5E9" style="stroke:#181818;stroke-width:0.5;"/><path d="M971.6598,456.8679 L971.6598,466.8679 L981.6598,466.8679 L971.6598,456.8679" fill="#E8F5E9" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="246.5842" x="701.7828" y="475.7649">Local-global alternation is what buys the</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="283.1698" x="683.49" y="493.4709">8 192-token window: only &#8968;22/3&#8969; = 8 layers pay</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="272.3373" x="688.9062" y="511.177">the quadratic &#920;(T&#178;&#183;H) attention bill; the other</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="229.8792" x="710.1353" y="528.883">14 pay &#920;(T&#183;w&#183;H) with window w = 128.</text></g><g class="entity" data-qualified-name="GMN23" data-source-line="58" id="ent0024"><path d="M356.97,733.0879 L356.97,796.2979 L322.43,800.2979 L356.97,804.2979 L356.97,867.03 A0,0 0 0 0 356.97,867.03 L732.1943,867.03 A0,0 0 0 0 732.1943,867.03 L732.1943,743.0879 L722.1943,733.0879 L356.97,733.0879 A0,0 0 0 0 356.97,733.0879" fill="#E8F5E9" style="stroke:#181818;stroke-width:0.5;"/><path d="M722.1943,733.0879 L722.1943,743.0879 L732.1943,743.0879 L722.1943,733.0879" fill="#E8F5E9" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="329.3552" x="375.4045" y="751.9849">candle's ModernBertHead / ModernBertDecoder have</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="316.8364" x="381.664" y="769.6909">private constructors, and ModernBertForMaskedLM</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="290.9923" x="394.586" y="787.397">hides its own encoder. libgrammstein therefore</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="138.3071" x="389.2495" y="805.103">rebuilds both from the</text><text fill="#000000" font-family="sans-serif" font-size="13" font-style="italic" lengthAdjust="spacing" textLength="30.862" x="530.9367" y="805.103">same</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="125.7361" x="565.1787" y="805.103">VarBuilder &#8212; weight</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="186.5892" x="446.7876" y="822.809">paths head.dense, head.norm,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="354.2243" x="362.97" y="840.515">model.embeddings.tok_embeddings.weight, decoder.bias</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="330.2911" x="374.9366" y="858.221">&#8212; so one 149 M-parameter encoder serves both exits.</text></g><!--link text to tok--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="dependency" data-source-line="38" id="lnk11"><path d="M515.58,105.4279 C515.58,123.0879 515.58,140.8079 515.58,159.9679" fill="none" id="text-to-tok" style="stroke:#37474F;stroke-width:1;"/><polygon fill="#37474F" points="515.58,164.9679,519.58,155.9679,515.58,159.9679,511.58,155.9679,515.58,164.9679" style="stroke:#37474F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link tok to emb--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="39" id="lnk12"><path d="M515.58,242.7579 C515.58,261.2879 515.58,278.4079 515.58,296.9579" fill="none" id="tok-to-emb" style="stroke:#37474F;stroke-width:1;"/><polygon fill="#37474F" points="515.58,301.9579,519.58,292.9579,515.58,296.9579,511.58,292.9579,515.58,301.9579" style="stroke:#37474F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#37474F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="92.4561" x="422.58" y="268.2549">token IDs (u32)</text></g><!--link emb to enc--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" data-source-line="40" id="lnk13"><path d="M515.58,380.0379 C515.58,397.9379 515.58,414.5279 515.58,434.2779" fill="none" id="emb-to-enc" style="stroke:#37474F;stroke-width:1;"/><polygon fill="#37474F" points="515.58,439.2779,519.58,430.2779,515.58,434.2779,511.58,430.2779,515.58,439.2779" style="stroke:#37474F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link enc to hid--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" data-link-type="dependency" data-source-line="41" id="lnk14"><path d="M515.58,555.2779 C515.58,575.6179 515.58,592.6179 515.58,609.6279" fill="none" id="enc-to-hid" style="stroke:#37474F;stroke-width:1;"/><polygon fill="#37474F" points="515.58,614.6279,519.58,605.6279,515.58,609.6279,511.58,605.6279,515.58,614.6279" style="stroke:#37474F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--li