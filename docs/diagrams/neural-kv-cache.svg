<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="739px" preserveAspectRatio="none" style="width:1162px;height:739px;background:#FAFAFA;" version="1.1" viewBox="0 0 1162 739" width="1162px" zoomAndPan="magnify"><?plantuml $version$?><defs/><g><rect fill="#FAFAFA" height="739" style="stroke:none;stroke-width:1;" width="1162" x="0" y="0"/><g class="title" data-source-line="18"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="453.9623" x="350.8614" y="24.9659">The KV-cache family &#8212; structure, growth, and why it is inert here</text></g><!--entity cfg--><g class="entity" data-qualified-name="cfg" data-source-line="20" id="ent0001"><rect fill="#90A4AE" height="77.2038" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="253.8411" x="607.01" y="56.7379"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="87.3457" x="690.2577" y="81.7039">CacheConfig</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="233.8411" x="617.01" y="100.7718">max_seq_len 8192 &#183; num_layers 12</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="231.8951" x="617.983" y="119.8397">num_heads 12 &#183; head_dim 64 &#183; F32</text></g><!--entity layer--><g class="entity" data-qualified-name="layer" data-source-line="22" id="ent0002"><rect fill="#90A4AE" height="96.2717" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="209.8673" x="7" y="47.1979"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="80.8777" x="71.4948" y="72.1639">LayerCache</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="189.8673" x="17" y="91.2318">key, value: Option&lt;Tensor&gt;</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="128.5195" x="47.6739" y="110.2997">shape (B, A, T, d_h)</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="94.7656" x="64.5508" y="129.3676">seq_len: usize</text></g><!--entity kv--><g class="entity" data-qualified-name="kv" data-source-line="24" id="ent0003"><rect fill="#90A4AE" height="96.2717" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="191.3454" x="638.26" y="204.5979"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="59.3458" x="704.2598" y="229.5639">KvCache</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="171.3454" x="648.26" y="248.6318">layers: Vec&lt;LayerCache&gt;</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="139.2435" x="664.3109" y="267.6997">update_layer(&#8467;, k, v)</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="97.7896" x="685.0379" y="286.7676">preallocate(B)</text></g><!--entity sw--><g class="entity" data-qualified-name="sw" data-source-line="26" id="ent0004"><rect fill="#90A4AE" height="96.2717" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="203.8333" x="459.02" y="423.9679"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="145.5154" x="488.1789" y="448.9339">SlidingWindowCache</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="103.9216" x="508.9758" y="468.0018">inner: KvCache</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="108.1916" x="506.8408" y="487.0697">window_size: W</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="183.8333" x="469.02" y="506.1376">narrow to the last W steps</text></g><!--entity model--><g class="entity" data-qualified-name="model" data-source-line="28" id="ent0005"><rect fill="#2E7D32" height="77.2038" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="235.4591" x="896.2" y="56.7379"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="191.6173" x="918.1209" y="81.7039">ModernBertModel::forward</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="149.1134" x="939.3728" y="100.7718">bidirectional encoder</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="215.4591" x="906.2" y="119.8397">&#8212; never consults a KV cache &#8212;</text></g><g class="entity" data-qualified-name="GMN10" data-source-line="36" id="ent0011"><path d="M251.88,46.0679 L251.88,91.1679 L217.28,95.1679 L251.88,99.1679 L251.88,144.598 A0,0 0 0 0 251.88,144.598 L571.9973,144.598 A0,0 0 0 0 571.9973,144.598 L571.9973,56.0679 L561.9973,46.0679 L251.88,46.0679 A0,0 0 0 0 251.88,46.0679" fill="#ECEFF1" style="stroke:#181818;stroke-width:0.5;"/><path d="M561.9973,46.0679 L561.9973,56.0679 L571.9973,56.0679 L561.9973,46.0679" fill="#ECEFF1" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="46.072" x="257.88" y="64.9649">update</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="249.6652" x="307.332" y="64.9649">concatenates along dim 2 (the time axis):</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="252.8734" x="281.0019" y="82.6709">K&#8348; &#8592; cat(K&#8348;&#8331;&#8321;, k_new),  V&#8348; &#8592; cat(V&#8348;&#8331;&#8321;, v_new).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="278.6552" x="268.111" y="100.377">Memory after T steps, both tensors, all layers:</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="208.1431" x="283.4965" y="118.083">2 &#183; B &#183; L &#183; A &#183; T &#183; d_h &#183; sizeof(dtype)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="36.361" x="495.0197" y="118.083">bytes.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="263.4385" x="275.7194" y="135.789">Defaults, B = 1, T = 8192, F32 &#10233; &#8776; 604 MB.</text></g><g class="entity" data-qualified-name="GMN13" data-source-line="44" id="ent0014"><path d="M697.88,360.8679 L697.88,583.3401 A0,0 0 0 0 697.88,583.3401 L1115.9783,583.3401 A0,0 0 0 0 1115.9783,583.3401 L1115.9783,370.8679 L1105.9783,360.8679 L767.75,360.8679 L763.75,301.1479 L759.75,360.8679 L697.88,360.8679 A0,0 0 0 0 697.88,360.8679" fill="#FFEBEE" style="stroke:#181818;stroke-width:0.5;"/><path d="M1105.9783,360.8679 L1105.9783,370.8679 L1115.9783,370.8679 L1105.9783,360.8679" fill="#FFEBEE" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="321.2303" x="741.814" y="379.7649">Trap 1 &#8212; preallocate is incompatible with update.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="232.3752" x="732.8635" y="397.4709">preallocate installs zero tensors of the</text><text fill="#000000" font-family="sans-serif" font-size="13" font-style="italic" lengthAdjust="spacing" textLength="18.369" x="968.6187" y="397.4709">full</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="81.6271" x="990.3677" y="397.4709">max_seq_len;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="97.0971" x="735.8925" y="415.177">the next update</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="158.9771" x="836.3696" y="415.177">concatenates onto them</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="73.6191" x="995.3467" y="415.177">, yielding an</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="333.0992" x="735.8795" y="432.883">(8192 + t)-step cache that is mostly zeros. It would only</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="358.7742" x="723.042" y="450.589">make sense against a write-in-place kernel, which does not</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="63.414" x="870.7221" y="468.295">exist here.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.38" x="900.7391" y="486.001">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="366.0543" x="719.402" y="503.707">Trap 2 &#8212; the defaults do not describe ModernBERT-base.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="339.8724" x="723.3669" y="521.4131">num_layers = 12 is BERT-shaped; ModernBERT-base has</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="14.872" x="1066.6193" y="521.4131">22</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="228.5142" x="713.201" y="539.1191">layers (heads = 12 and head_dim = 64</text><text fill="#000000" font-family="sans-serif" font-size="13" font-style="italic" lengthAdjust="spacing" textLength="19.045" x="945.0952" y="539.1191">are</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="124.1371" x="967.5202" y="539.1191">right: 12 &#215; 64 = 768).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="397.0983" x="703.88" y="556.8251">Sizing a cache from CacheConfig::default() under-counts memory</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="47.164" x="878.8471" y="574.5311">by 45%.</text></g><g class="entity" data-qualified-name="GMN16" data-source-line="59" id="ent0017"><path d="M357.19,643.3479 L357.19,724.172 A0,0 0 0 0 357.19,724.172 L764.6803,724.172 A0,0 0 0 0 764.6803,724.172 L764.6803,653.3479 L754.6803,643.3479 L564.93,643.3479 L560.93,520.6679 L556.93,643.3479 L357.19,643.3479 A0,0 0 0 0 357.19,643.3479" fill="#ECEFF1" style="stroke:#181818;stroke-width:0.5;"/><path d="M754.6803,643.3479 L754.6803,653.3479 L764.6803,653.3479 L754.6803,643.3479" fill="#ECEFF1" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="310.3492" x="363.19" y="662.2449">update_layer returns the pre-narrowing tensors</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="72.7611" x="676.9192" y="662.2449">&#8212; the caller</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="353.6003" x="379.635" y="679.9509">attends over the full history for the current step, while the</text><text fill="#000000" font-family="sans-serif" font-size="13" font-style="italic" lengthAdjust="spacing" textLength="36.439" x="379.1735" y="697.657">stored</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="314.7043" x="418.9925" y="697.657">cache (and seq_len()) is clamped to the last W steps.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="284.5964" x="414.137" y="715.363">Memory becomes &#920;(min(T, W)) instead of &#920;(T).</text></g><!--link cfg to kv--><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" data-link-type="dependency" data-source-line="30" id="lnk6"><path d="M733.93,134.2479 C733.93,155.3679 733.93,176.6679 733.93,199.1279" fill="none" id="cfg-to-kv" style="stroke:#37474F;stroke-width:1;"/><polygon fill="#37474F" points="733.93,204.1279,737.93,195.1279,733.93,199.1279,729.93,195.1279,733.93,204.1279" style="stroke:#37474F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#37474F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="115.6741" x="617.93" y="165.0849">shapes the tensors</text></g><!--link layer to kv--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="31" id="lnk7"><path d="M111.93,143.5479 C111.93,189.9679 111.93,253.1679 111.93,253.1679 C111.93,253.1679 458.18,253.1679 632.77,253.1679" fill="none" id="layer-to-kv" style="stroke:#37474F;stroke-width:1;"/><polygon fill="#37474F" points="637.77,253.1679,628.77,249.1679,632.77,253.1679,628.77,257.1679,637.77,253.1679" style="stroke:#37474F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#37474F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="80.6651" x="239.04" y="249.0649">one per layer</text></g><!--link kv to sw--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" data-source-line="32" id="lnk8"><path d="M650.56,301.1479 C650.56,337.6179 650.56,382.3779 650.56,418.8179" fill="none" id="kv-to-sw" style="stroke:#37474F;stroke-width:1;"/><polygon fill="#37474F" points="650.56,423.8179,654.56,414.8179,650.56,418.8179,646.56,414.8179,650.56,423.8179" style="stroke:#37474F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#37474F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="54.197" x="595.56" y="358.3849">wrapped</text></g><!--link model to kv--><g class="link" data-entity-1="ent0005" data-entity-2="ent0003" data-link-type="dependency" data-source-line="33" id="lnk9"><path d="M1006.09,134.3479 C1006.09,181.0879 1006.09,253.1679 1006.09,253.1679 C1006.09,253.1679 913.24,253.1679 834.89,253.1679" fill="none" id="model-to-kv" style="stroke:#C62828;stroke-width:1;stroke-dasharray:7,7;"/><polygon fill="#C62828" points="829.89,253.1679,838.89,257.1679,834.89,253.1679,838.89,249.1679,829.89,253.1679" style="stroke:#C62828;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#37474F" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="168.2851" x="978.4" y="249.0649">no edge exists in the code</text></g><?plantuml-src VLRTQXj75BxVfpWab4YgVcBPiHqb3bYE1CK9XLZO5tKnezsHTj3kZ3epgurI2cqefQKtXHRQYq8l-mYbj-bz7q9Fqk_ChcFbhnYlTkQSER_V-MRlq2ILT7hUYKMCbvd8LRQcnXEnblOaRFNeT7NzTfQfHEdvXTA9ASDcSq3AEtBU5h4lh6ppChf3SsjAdr8coZO9dP37ULyQybOi7GcQ5QnDIdivjy8RItdXF2sqAKbCJU6xzDYAKcFRouIcCXQ5ap2iF2duYyLiPZ8EXZPV_qBQK2ooZ9poR3IuYs4NJwEhuE1LhydCMEOGp7efNHS6dqcTI3kWPIQqB_ACEjwjvfIOsFKI9H1TxdfQ5bPadSMggbDt2KMSFJE5ZMKmQWkaEqCUOpNdpFeSHZ0IctnfjDJ-saolif4dzEhFUzt8BPHU2hYXgOWNA5oXanEJmTJjyJ7_RMcuLA3odFLCPAZ7ZIIHCr5aVYAV--DCpNKEXnJZ8UsMLgQqvCp9M9-QBO6LiHTwdadwCY8Q6-sh4CeK5QrtplmQyYdAZesXiIXR7MT_VxU_UuZTEdYhfQMTVlJLbeTZ2qZK-hi7UmTxuxU5Drwl5RpoyFW-X7BJjq1NmQs2MfckQvGWMUifbLP6qKs2jrgj0DqJesTgtcfTwbmyltBoYwjCQZhSkT-dLt-HBlAhZAV08P5BpSjKYeHNBERtgqJbjB_7o_5k_nO9H_5iJhVltptUEnwzvV9cejZZGgxRj19P8GVqwT8henzEf7R6FhhKw34Qr1YswRXDapObLsaJkrLy0ogSUY63in3U1zpLCyk-gYm6T2xZXpTHm56nJ30XLPQDpRS_jsc1eE1hQIM6oSIGDeRDu6kn-e2ZToc1VIgjUQRgA2vr6SHN7Fg0Bb1EmGqdRyAaPWA