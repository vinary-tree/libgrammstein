<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="542px" preserveAspectRatio="none" style="width:1546px;height:542px;background:#FAFAFA;" version="1.1" viewBox="0 0 1546 542" width="1546px" zoomAndPan="magnify"><?plantuml $version$?><defs/><g><rect fill="#FAFAFA" height="542" style="stroke:none;stroke-width:1;" width="1546" x="0" y="0"/><g class="title" data-source-line="17"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="436.7703" x="551.3675" y="24.9659">EmbeddingCache &#8212; lock-free payload, mutex-guarded recency</text></g><!--entity caller--><g class="entity" data-qualified-name="caller" data-source-line="19" id="ent0001"><rect fill="#2E7D32" height="58.1358" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="181.6154" x="683.44" y="258.9479"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="40.3338" x="709.4419" y="283.9139">Caller</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="85.6377" x="753.4158" y="283.9139">(any thread)</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="161.6154" x="693.44" y="302.9818">embedder.embed(text)</text></g><!--entity hash--><g class="entity" data-qualified-name="hash" data-source-line="21" id="ent0002"><rect fill="#00838F" height="96.2717" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="161.4415" x="283.53" y="432.6979"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="67.9697" x="330.2659" y="457.6639">hash_text</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="141.4415" x="293.53" y="476.7318">util::hash::safe_hash</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="138.2563" x="295.1226" y="495.7997">&#8805; 16 B &#10230; gxhash64</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="123.0259" x="302.7378" y="514.8676">&lt; 16 B &#10230; xxh3_64</text></g><!--entity map--><g class="entity" data-qualified-name="map" data-source-line="23" id="ent0003"><rect fill="#00838F" height="96.2717" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="203.8473" x="672.32" y="47.0679"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="49.3638" x="749.5617" y="72.0339">entries</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="183.8473" x="682.32" y="91.1018">DashMap&lt;u64, Arc&lt;[f32]&gt;&gt;</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="61.6978" x="690.811" y="110.1697">lock-free</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="101.5276" x="756.1487" y="110.1697">sharded probe</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="182.7917" x="682.8478" y="129.2376">hit &#10233; Arc::clone (no copy)</text></g><!--entity order--><g class="entity" data-qualified-name="order" data-source-line="25" id="ent0004"><rect fill="#00838F" height="77.2038" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="278.495" x="7" y="249.4179"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="89.4737" x="101.5107" y="274.3839">access_order</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="258.495" x="17" y="293.4518">parking_lot::Mutex&lt;VecDeque&lt;u64&gt;&gt;</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="12.5508" x="93.3243" y="312.5197">&#9888;</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="89.6556" x="109.515" y="312.5197">the only lock</text></g><!--entity model--><g class="entity" data-qualified-name="model" data-source-line="27" id="ent0005"><rect fill="#2E7D32" height="77.2038" rx="6" ry="6" style="stroke:#263238;stroke-width:0.5;" width="242.3192" x="900.09" y="249.4179"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="56.3778" x="993.0607" y="274.3839">Encoder</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="222.3192" x="910.09" y="293.4518">ModernBertModel forward pass</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="182.7818" x="929.8587" y="312.5197">&#8776; 10&#8310; &#215; the cost of a probe</text></g><g class="entity" data-qualified-name="GMN13" data-source-line="39" id="ent0014"><path d="M320.18,203.3379 L320.18,283.9679 L285.68,287.9679 L320.18,291.9679 L320.18,372.6921 A0,0 0 0 0 320.18,372.6921 L648.3053,372.6921 A0,0 0 0 0 648.3053,372.6921 L648.3053,213.3379 L638.3053,203.3379 L320.18,203.3379 A0,0 0 0 0 320.18,203.3379" fill="#FFEBEE" style="stroke:#181818;stroke-width:0.5;"/><path d="M638.3053,203.3379 L638.3053,213.3379 L648.3053,213.3379 L638.3053,203.3379" fill="#FFEBEE" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="114.8161" x="348.5335" y="222.2349">Cost of the touch.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="144.2222" x="466.7296" y="222.2349">`order.iter().position(&#8230;)`</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="290.5502" x="334.4675" y="239.9409">is a linear scan of up to max_entries keys, and it</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="27.664" x="326.18" y="257.647">runs</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="158.3531" x="357.224" y="257.647">while holding the mutex</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="114.3481" x="518.9572" y="257.647">&#8212; on both get and</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="286.9753" x="336.255" y="275.353">insert. The map probe is &#119978;(1) and lock-free; the</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="304.7723" x="327.3565" y="293.059">recency update is &#119978;(N) and serialized. With 10 000</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="288.4702" x="335.5076" y="310.765">entries and many threads this is the contention</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="294.0068" x="332.7392" y="328.471">point, not DashMap. It is still &#8776; 10&#8315;&#8310; of a forward</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="177.1772" x="348.3255" y="346.177">pass, so it never dominates a</text><text fill="#000000" font-family="sans-serif" font-size="13" font-style="italic" lengthAdjust="spacing" textLength="25.961" x="528.8827" y="346.177">miss</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="52.9361" x="558.2237" y="346.177">&#8212; only a</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="257.2442" x="351.1206" y="363.8831">hit-heavy, highly-parallel workload feels it.</text></g><g class="entity" data-qualified-name="GMN16" data-source-line="51" id="ent0017"><path d="M1176.99,238.7579 L1176.99,337.288 L1531.5052,337.288 L1531.5052,248.7579 L1521.5052,238.7579 L1176.99,238.7579" fill="#E0F2F1" style="stroke:#181818;stroke-width:0.5;"/><path d="M1521.5052,238.7579 L1521.5052,248.7579 L1531.5052,248.7579 L1521.5052,238.7579" fill="#E0F2F1" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="124.4101" x="1195.9705" y="257.6549">Digest-only keying.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="179.7642" x="1323.7606" y="257.6549">The text is not stored, only its</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="326.0403" x="1186.7275" y="275.3609">64-bit digest. Two distinct texts that collide return the</text><text fill="#000000" font-family="sans-serif" font-size="13" font-style="italic" lengthAdjust="spacing" textLength="36.946" x="1182.99" y="293.067">wrong</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="293.1892" x="1223.316" y="293.067">vector. At N = 10 000 entries the birthday bound</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="306.0434" x="1196.7259" y="310.773">gives &#8776; N&#178;/2&#8310;&#8309; &#8776; 2.7 &#215; 10&#8315;&#185;&#178; &#8212; negligible, but it is a</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="236.5742" x="1231.4605" y="328.479">correctness trade, not an impossibility.</text></g><!--link caller to hash--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="dependency" data-source-line="29" id="lnk6"><path d="M774.25,317.5179 C774.25,375.1079 774.25,496.9679 774.25,496.9679 C774.25,496.9679 569.74,496.9679 450.25,496.9679" fill="none" id="caller-to-hash" style="stroke:#37474F;stroke-width:1;"/><polygon fill="#37474F" points="445.25,496.9679,454.25,500.9679,450.25,496.9679,454.25,492.9679,445.25,496.9679" style="stroke:#37474F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#37474F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="23.595" x="675.48" y="492.8649">text</text></g><!--link hash to map--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="30" id="lnk7"><path d="M445.42,464.9679 C538.35,464.9679 677.88,464.9679 677.88,464.9679 C677.88,464.9679 677.88,248.7779 677.88,148.5479" fill="none" id="hash-to-map" style="stroke:#37474F;stroke-width:1;"/><polygon fill="#37474F" points="677.88,143.5479,673.88,152.5479,677.88,148.5479,681.88,152.5479,677.88,143.5479" style="stroke:#37474F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#37474F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="59.384" x="617.88" y="416.3849">64-bit key</text></g><!--link map to caller--><g class="link" data-entity-1="ent0003" data-entity-2="ent0001" data-link-type="dependency" data-source-line="31" id="lnk8"><path d="M774.25,143.3679 C774.25,179.6179 774.25,223.1279 774.25,253.7279" fill="none" id="map-to-caller" style="stroke:#37474F;stroke-width:1;"/><polygon fill="#37474F" points="774.25,258.7279,778.25,249.7279,774.25,253.7279,770.25,249.7279,774.25,258.7279" style="stroke:#37474F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#37474F" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="17.979" x="673.25" y="196.9449">hit</text><text fill="#37474F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="79.0661" x="694.609" y="196.9449">&#8212; Arc&lt;[f32]&gt;</text></g><!--link map to model--><g class="link" data-entity-1="ent0003" data-entity-2="ent0005" data-link-type="dependency" data-source-line="32" id="lnk9"><path d="M870.61,143.8279 C870.61,190.1779 870.61,252.9679 870.61,252.9679 C870.61,252.9679 877.53,252.9679 894.66,252.9679" fill="none" id="map-to-model" style="stroke:#37474F;stroke-width:1;"/><polygon fill="#37474F" points="899.66,252.9679,890.66,248.9679,894.66,252.9679,890.66,256.9679,899.66,252.9679" style="stroke:#37474F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#37474F" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="29.614" x="840.61" y="208.8149">miss</text></g><!--link model to map--><g class="link" data-entity-1="ent0005" data-entity-2="ent0003" data-link-type="dependency" data-source-line="33" id="lnk10"><path d="M899.62,255.9679 C881,255.9679 867.83,255.9679 867.83,255.9679 C867.83,255.9679 867.83,195.7979 867.83,148.4379" fill="none" id="model-to-map" style="stroke:#37474F;stroke-width:1;"/><polygon fill="#37474F" points="867.83,143.4379,863.83,152.4379,867.83,148.4379,871.83,152.4379,867.83,143.4379" style="stroke:#37474F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#37474F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="133.2631" x="733.83" y="230.4949">insert(key, Arc&lt;[f32]&gt;)</text></g><!--link map to order--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" data-source-line="35" id="lnk11"><path d="M672.18,78.9679 C483.65,78.9679 99.83,78.9679 99.83,78.9679 C99.83,78.9679 99.83,183.7279 99.83,244.1879" fill="none" id="map-to-order" style="stroke:#37474F;stroke-width:1;stroke-dasharray:7,7;"/><polygon fill="#37474F" points="99.83,249.1879,103.83,240.1879,99.83,244.1879,95.83,240.1879,99.83,249.1879" style="stroke:#37474F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#37474F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="178.9582" x="121.9" y="74.8649">get: touch (move key to back)</text></g><!--link map to order--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" data-source-line="36" id="lnk12"><path d="M671.94,110.9679 C505.07,110.9679 192.66,110.9679 192.66,110.9679 C192.66,110.9679 192.66,192.0479 192.66,244.1679" fill="none" id="map-to-order-1" style="stroke:#37474F;stroke-width:1;stroke-dasharray:7,7;"/><polygon fill="#37474F" points="192.66,249.1679,196.66,240.1679,192.66,244.1679,188.66,240.1679,192.66,249.1679" style="stroke:#37474F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#37474F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="141.1931" x="221.21" y="125.8649">insert: evict front if full,</text><text fill="#37474F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="133.8351" x="224.889" y="143.5709">then push key to back</text></g><!--link map to GMN16--><g class="link" data-entity-1="ent0003" data-entity-2="ent0017" data-link-type="association" data-source-line="51" id="lnk18"><path d="M873.39,143.5079 C873.39,186.9379 873.39,243.9679 873.39,243.9679 C873.39,243.9679 1039.58,243.9679 1176.56,243.9679" fill="none" id="map-GMN16" style="stroke:#37474F;stroke-width:1;stroke-dasharray:7,7;"/></g><?plantuml-src TLLDRoD54BtxLvJOmpfMFFwAajKG8YKRMrg93T9cWGD1sVPCUwQLThVfxh5Z4DBk3Qu82Ga9mGMGEAx4IYjkuP_a5_0JUDKpIKm0vP1nTrMzgbUlgX_IU3wLUQvCyLXafIHbWdH6Q9-I86spY-xCIKd7mfTFnO9crb60sKAijHNvDepcLP2NtQ8IBfSvVIIpO_bP9LiFe-txppua9pDfidL2fwLTULhWj_9IhsbLIYSR67foIiBa_E_aW-SKn8Kqs_64uSBAKcPzy0dYFfCcbowbXHOcL7DDtU2N1UKsyxrSYSA9kUyPMJcXknaNbInW1STJMxbCafrHS5KeOu8JLLH8Oe32wmYPdI-iaIRSnEZLCUOvNVqwIbh-Gfc500PDHNPHE5kP_B7L2FLWSiX_6nQ-5BbTWLkQWL6vSPFBcQXqU2ulmw5MXPa3a40JoD-mqih8i5uWPHTAkt412eCmXPRqHOjeOas