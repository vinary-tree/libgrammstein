\* TLC liveness configuration for CronStateMachine.tla.
\* Uses the smallest task bound that still covers panic-safety scheduling.

CONSTANT
    MaxTasks = 2
    MaxTime = 60

SPECIFICATION FairSpec

CHECK_DEADLOCK FALSE

INVARIANT TypeOK
INVARIANT Safety
INVARIANT TaskIdConsistency
INVARIANT TestProgressRequiresExecution
INVARIANT NormalTaskWaitsForEarlierPanic

PROPERTY TestEventuallyCompletes
PROPERTY CronEventuallyTerminates
PROPERTY NormalTaskExecutesAfterPanic
PROPERTY ReadySignalEventuallyReceived
