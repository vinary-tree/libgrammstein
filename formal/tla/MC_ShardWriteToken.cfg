\* TLC Model Checker Configuration for ShardWriteToken.tla
\*
\* Run with: tlc MC_ShardWriteToken.tla -config MC_ShardWriteToken.cfg
\*
\* This configuration bounds the state space to make model checking tractable
\* while still covering interesting scenarios.

\* Constants
\* ---------
\* Use small bounds to keep state space manageable
\* Recommended: Workers=3, Shards=2, MaxGeneration=3 for initial runs

CONSTANT Workers = {w1, w2, w3}
CONSTANT Shards = {s1, s2}
CONSTANT MaxGeneration = 10

\* Specification
\* -------------
SPECIFICATION Spec

\* Invariants to check (safety properties)
\* ---------------------------------------
\* Note: TypeOK omitted as it bounds generation which conflicts with state constraint
INVARIANT AtMostOneWriter
INVARIANT LockedImpliesHolder
INVARIANT UnlockedImpliesNoHolder
INVARIANT ValidTokenGenerationMatch
INVARIANT ValidTokenImpliesHolder

\* Temporal properties to check (liveness)
\* ---------------------------------------
\* Note: Liveness checking is more expensive; enable selectively
\* PROPERTY EventuallyGranted
\* PROPERTY NoStarvation

\* State constraint to bound exploration
\* -------------------------------------
CONSTRAINT StateConstraint

\* Symmetry reduction (improves performance)
\* -----------------------------------------
\* Workers are symmetric - any permutation behaves the same
SYMMETRY WorkerSymmetry
