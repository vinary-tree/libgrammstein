\* TLC safety configuration for WorkerShutdown.tla.
\* Uses no symmetry reduction so state coverage matches the liveness config.

CONSTANT Workers = {w1, w2}
CONSTANT Jobs = {j1, j2, j3}
CONSTANT MaxRetries = 3

INIT Init
NEXT Next

CHECK_DEADLOCK FALSE

INVARIANT TypeOK
INVARIANT ProcessingHasJob
INVARIANT SendingHasJob
INVARIANT IdleNoJob
INVARIANT ResultsDisjoint
INVARIANT CheckpointAfterDrain
INVARIANT CheckpointRequiresShutdown
INVARIANT AbortStatesDoNotCheckpoint
INVARIANT NoJobLost
INVARIANT JobUniqueOwnership
INVARIANT Safety
