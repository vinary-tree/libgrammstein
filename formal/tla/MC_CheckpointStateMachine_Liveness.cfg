\* TLC liveness configuration for CheckpointStateMachine.tla.
\* Uses small bounds and no symmetry because symmetry can hide liveness bugs.

CONSTANT Orders = {1}
CONSTANT Prefixes = {p_a, p_b}
CONSTANT Workers = {w1}

SPECIFICATION FairSpec

CHECK_DEADLOCK FALSE

INVARIANT TypeOK
INVARIANT Safety

PROPERTY RecoveryEventual
PROPERTY RestartEventuallyAfterRecovery
PROPERTY InProgressEventuallyResolves
