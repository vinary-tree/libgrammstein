SPECIFICATION Spec

CONSTANTS
    Workers = {w1, w2, w3}
    Shards = {s1, s2}
    Jobs = {j1, j2, j3, j4}
    MaxSyncAttempts = 2

INVARIANTS
    TypeOK
    Safety
    AtMostOneSyncer
    CheckpointAtomicity
    SyncerConsistency
    CleanMeansZeroDirty
    WorkerStateJobConsistency
    JobPartition

\* Liveness is checked by AsyncShardSync_Liveness.cfg.
\* PROPERTIES
\*     CheckpointEventuallyCompletes
\*     AllJobsEventuallyComplete
