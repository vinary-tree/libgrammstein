\* TLC Model Checker Configuration for CheckpointStateMachine.tla
\*
\* Run with: tlc MC_CheckpointStateMachine.tla -config MC_CheckpointStateMachine.cfg
\*
\* This configuration bounds the state space for tractable model checking.

\* Constants
\* ---------
\* Use small bounds: 2 orders, 3 prefixes, 2 workers
\* This covers interesting scenarios while keeping state space manageable

CONSTANT Orders = {1, 2}
CONSTANT Prefixes = {p_a, p_b, p_c}
CONSTANT Workers = {w1, w2}

\* Specification
\* -------------
SPECIFICATION Spec

\* Invariants to check (safety properties)
\* ---------------------------------------
INVARIANT TypeOK
INVARIANT DisjointSets
INVARIANT StateConsistent
INVARIANT CompletedOrderNoInProgress
INVARIANT WorkerAssignmentConsistent
INVARIANT NoDoubleProcessing
INVARIANT Safety

\* Temporal properties (liveness)
\* ------------------------------
\* Enable selectively - liveness checking is more expensive
\* PROPERTY InProgressEventuallyResolves

\* Symmetry reduction
\* ------------------
\* Prefixes are symmetric
SYMMETRY PrefixSymmetry

\* State constraints to limit exploration
\* --------------------------------------
\* Uncomment to limit crash/restart cycles
\* CONSTRAINT CrashLimit
