\* TLC Model Checker Configuration for WorkerShutdown.tla
\*
\* Run with: tlc WorkerShutdown.tla -config MC_WorkerShutdown.cfg -workers auto
\*
\* This configuration bounds the state space for tractable model checking.

\* Constants
\* ---------
\* Use small bounds: 3 workers, 4 jobs
\* This covers interesting scenarios while keeping state space manageable

CONSTANT Workers = {w1, w2, w3}
CONSTANT Jobs = {j1, j2, j3, j4}
CONSTANT MaxRetries = 3

\* Specification
\* -------------
SPECIFICATION FairSpec

\* Disable deadlock checking - terminal state (Done) is valid
\* ----------------------------------------------------------
CHECK_DEADLOCK FALSE

\* Invariants to check (safety properties)
\* ---------------------------------------
INVARIANT TypeOK
INVARIANT ProcessingHasJob
INVARIANT SendingHasJob
INVARIANT IdleNoJob
INVARIANT ResultsDisjoint
INVARIANT CheckpointAfterDrain
INVARIANT NoJobLost
INVARIANT JobUniqueOwnership
INVARIANT Safety

\* Temporal properties (liveness)
\* ------------------------------
\* These verify eventual termination and completion
PROPERTY WorkersEventuallyTerminate
PROPERTY ProcessingEventuallySendsResult
PROPERTY CheckpointEventuallyCompletes

\* Symmetry reduction
\* ------------------
\* Workers are symmetric (Jobs also, but TLC only allows one SYMMETRY)
SYMMETRY WorkerSymmetry
