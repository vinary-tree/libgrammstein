\* Larger bounded safety configuration for AsyncShardSync.tla.
\* Extends the liveness model with three shards while keeping the
\* worker/job cross-product small enough for complete stress runs.

SPECIFICATION Spec

CONSTANTS
    Workers = {w1, w2}
    Shards = {s1, s2, s3}
    Jobs = {j1, j2, j3}
    MaxSyncAttempts = 3

INVARIANTS
    TypeOK
    Safety
    AtMostOneSyncer
    CheckpointAtomicity
    SyncerConsistency
    CleanMeansZeroDirty
    WorkerStateJobConsistency
    JobPartition
