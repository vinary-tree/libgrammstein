\* TLC liveness configuration for AsyncShardSync.tla.
\* Smaller bounds keep fairness checking tractable.

SPECIFICATION FairSpec

CONSTANTS
    Workers = {w1, w2}
    Shards = {s1}
    Jobs = {j1, j2}
    MaxSyncAttempts = 2

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    Safety
    WorkerStateJobConsistency

PROPERTIES
    CheckpointEventuallyCompletes
    AllJobsEventuallyComplete
