\* Configuration for TLC model checker

\* Constants
CONSTANT
    MaxTasks = 3
    MaxTime = 100

\* Initial state and next-state relation
INIT Init
NEXT Next

\* Safety invariants to check
INVARIANT TypeOK
INVARIANT Safety
INVARIANT ReadySignalSafety
INVARIANT PanicIsolation
INVARIANT TestCompletionRequiresExecution
INVARIANT TerminationRequiresRequest

\* Use fair specification for liveness checking
\* Uncomment to check liveness properties (requires more time)
\* SPECIFICATION FairSpec

\* Liveness properties (uncomment to check)
\* PROPERTY TestEventuallyCompletes
\* PROPERTY CronEventuallyTerminates
\* PROPERTY NormalTaskExecutesAfterPanic
\* PROPERTY ReadySignalEventuallyReceived
