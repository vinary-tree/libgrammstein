\* TLC Model Checker Configuration for WorkerShutdown.tla (without symmetry)
\*
\* Run with: tlc WorkerShutdown.tla -config MC_WorkerShutdown_NoSymmetry.cfg -workers auto
\*
\* This configuration verifies liveness properties without symmetry reduction.
\* Use this to rigorously verify temporal properties.

\* Constants
\* ---------
\* Use smaller bounds for exhaustive liveness checking
CONSTANT Workers = {w1, w2}
CONSTANT Jobs = {j1, j2, j3}
CONSTANT MaxRetries = 3

\* Specification
\* -------------
SPECIFICATION FairSpec

\* Disable deadlock checking - terminal state (Done) is valid
\* ----------------------------------------------------------
CHECK_DEADLOCK FALSE

\* Invariants to check (safety properties)
\* ---------------------------------------
INVARIANT TypeOK
INVARIANT ProcessingHasJob
INVARIANT SendingHasJob
INVARIANT IdleNoJob
INVARIANT ResultsDisjoint
INVARIANT CheckpointAfterDrain
INVARIANT NoJobLost
INVARIANT JobUniqueOwnership
INVARIANT Safety

\* Temporal properties (liveness)
\* ------------------------------
\* These verify eventual termination and completion
PROPERTY WorkersEventuallyTerminate
PROPERTY ProcessingEventuallySendsResult
PROPERTY CheckpointEventuallyCompletes

\* No symmetry reduction - safer for liveness checking
