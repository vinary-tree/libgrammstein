\* TLC liveness configuration for ShardWriteToken.tla.
\* Uses smaller bounds and no symmetry because symmetry can hide liveness bugs.

CONSTANT Workers = {w1, w2}
CONSTANT Shards = {s1}
CONSTANT MaxGeneration = 3

SPECIFICATION FairSpec

CHECK_DEADLOCK FALSE

INVARIANT TypeOK
INVARIANT Safety

PROPERTY NoStarvation
PROPERTY HeldLockEventuallyReleases
