\* Larger bounded safety configuration for CheckpointStateMachine.tla.
\* Extends the standard safety model with an additional symmetric prefix while
\* staying small enough for complete stress runs under the default timeout.

CONSTANT Orders = {1, 2}
CONSTANT Prefixes = {p_a, p_b, p_c, p_d}
CONSTANT Workers = {w1, w2}

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT DisjointSets
INVARIANT StateConsistent
INVARIANT CompletedOrderNoInProgress
INVARIANT WorkerAssignmentConsistent
INVARIANT NoDoubleProcessing
INVARIANT CrashRecoverySound
INVARIANT Safety

SYMMETRY PrefixSymmetry
